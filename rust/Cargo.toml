[package]
name = "inorbithr"
version = "0.2.1"
description = "The InOrbit API client for Rust: the runtime every generated SDK surface runs on."
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/inorbithr/sdk"
homepage = "https://docs.inorbit.hr"
documentation = "https://docs.rs/inorbithr"
readme = "README.md"
keywords = ["inorbit", "api", "sdk", "client"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["rustls", "tracing"]
# TLS through rustls with the platform's trust roots. Without it the crate builds, but
# a client can only call plain-HTTP loopback addresses (tests, local stacks).
rustls = ["reqwest/rustls", "dep:rustls", "dep:tokio-rustls", "dep:rustls-platform-verifier", "dep:rustls-webpki"]
# Log records as `tracing` events, target `inorbithr` (docs/config.md section 7.9).
tracing = ["dep:tracing"]
# OpenTelemetry spans and metrics through the `opentelemetry` API crate
# (docs/config.md section 7.10). The SDK sends nothing itself; the caller's pipeline does.
otel = ["dep:opentelemetry"]
# A client key encrypted with a password (`client_key_password`, PKCS#8 PBES2).
encrypted-key = ["rustls", "dep:pkcs8"]

[dependencies]
# HTTP; TLS is chosen by the features above, so no TLS backend is a hard dependency.
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "query", "form"] }
# Wire format.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed errors.
thiserror = "2"
# The runtime: timers for backoff and the single-flight token exchange.
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "process", "io-util"] }
# URL checks and joins (SR-07).
url = "2"
# RFC 3339 timestamps in models.
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
# Random request ids and retry jitter.
getrandom = "0.4"
# Secrets are zeroed on drop (SR-11).
zeroize = "1"
# Streams (design.md section 7): the standard `Stream` trait an `EventStream` implements,
# and the socket's `Stream`/`Sink` combinators. Both already come with reqwest.
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The /v1/ws socket: the WebSocket protocol only, over our own TCP and TLS, so no second
# TLS stack or trust store comes with it.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# The socket's TLS: the same rustls, provider and platform verifier reqwest uses.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
# Pinned keys (SR-06): the end-entity certificate's public key, from the same parser
# rustls uses.
rustls-webpki = { version = "0.103", default-features = false, features = ["std"], optional = true }
# The config file the command line shares (docs/config.md section 4.2).
toml = { version = "1", default-features = false, features = ["parse", "std", "serde"] }
# Pinned keys, JWT expiry and proxy credentials; already a dependency of reqwest.
base64 = "0.23"
# Log records (feature `tracing`, on by default).
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
# Spans and metrics (feature `otel`): the API crate only.
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"], optional = true }
# An encrypted client key (feature `encrypted-key`).
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
wiremock = "0.6"
serde_yaml_ng = "0.10"
tempfile = "3"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
regex = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"

[package.metadata.docs.rs]
all-features = false
