[default]
# Short commit hashes in release-please changelog links (ba33bdf) are not words.
extend-ignore-re = ["\\[[0-9a-f]{7,12}\\]\\(https://github\\.com/[^)]*/commit/[0-9a-f]{40}\\)"]

[default.extend-words]
# Croatian and product words that appear in docs.
hr = "hr"
# The gzip crate (flate2).
flate = "flate"

[default.extend-identifiers]
# A pydantic-core function name.
plain_serializer_function_ser_schema = "plain_serializer_function_ser_schema"

[files]
extend-exclude = ["LICENSE", "CODE_OF_CONDUCT.md", "spec/*.json", "**/generated/**", "**/CHANGELOG.md", "cli/crates/iohr/tests/data/host-action/vectors/", "cli/crates/iohr/tests/data/ask-claude.jsonl"]
