name: per-call-middleware-runs-once-per-call
area: middleware
summary: A per-call middleware runs once for a call that takes two attempts; a per-retry middleware runs twice.
pending: [go, rust, py, java, csharp]
notes: M6, docs/config.md sections 7.1 and 7.3.
client:
  pipeline: { add: [{ name: call-probe, stage: per_call }, { name: attempt-probe, stage: per_retry }] }
action: { op: me }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, json: { access_token: tok-secret-1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me }
    response: { status: 503, json: { code: unavailable, error: try again } }
  - request: { method: GET, path: /v1/me, max_delay_ms: 9000 }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
  attempts: 2
  probes:
    call-probe: { count: 1 }
    attempt-probe: { count: 2 }
