name: logs-carry-metadata-never-secrets-or-bodies
area: middleware
summary: Debug logs of a write name the operation, path, status and attempt, and never the token, the key secret or anything from the body.
pending: [go, rust, py, java, csharp]
notes: M6, docs/config.md section 7.9; SR-13.
client:
  log: debug
  log_headers: true
action: { op: events.create_endpoint, args: { account_id: acc_1, url: "https://private-marker.example.com/hook", description: private-body-marker, event_types: [radar.digest.published] } }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, json: { access_token: tok-secret-1, token_type: bearer, expires_in: 899 } }
  - request: { method: POST, path: /v1/webhooks/endpoints }
    response: { status: 200, json: { endpoint: { id: we_1, url: "https://private-marker.example.com/hook", event_types: [radar.digest.published] }, signing_secret: whsec-marker } }
expect:
  logs:
    contains:
      - { event: request, operation: events.create_endpoint, method: POST, path: /v1/webhooks/endpoints, attempt: 1 }
      - { event: response, status: 200, attempt: 1 }
    excludes: [tok-secret-1, s3cr3t, private-body-marker, private-marker.example.com, whsec-marker, Bearer]
