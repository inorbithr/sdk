name: a-user-middleware-sees-the-request-id-and-the-token
area: middleware
summary: A per-retry middleware sees the finished request, its request id and Authorization header included, while the logs never carry the token.
pending: [go, rust, py, java, csharp]
notes: M6, docs/config.md sections 7.2, 7.9 and 7.13.
client:
  pipeline: { add: [{ name: probe, stage: per_retry }] }
  log: debug
action: { op: me }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, json: { access_token: tok-secret-1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer tok-secret-1, x-request-id: "$rid" } }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
  probes:
    probe: { count: 1, seen: [{ authorization: Bearer tok-secret-1, x-request-id: "~iohr-[0-9a-f]{16}" }] }
  logs:
    contains: [{ event: request, operation: me, method: GET, path: /v1/me, attempt: 1 }]
    excludes: [tok-secret-1, s3cr3t]
