name: config-load
area: examples
summary: "A client built with load reads the environment, the config file and the login, names where each setting came from, and calls the API."
action: { op: example }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer t1 } }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  attempts: 1
  token_exchanges: 1
