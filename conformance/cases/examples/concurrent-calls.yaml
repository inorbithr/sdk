name: concurrent-calls
area: examples
summary: "Three calls at once on one client share one token exchange."
action: { op: example, concurrent: 3 }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, delay_ms: 100, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - { request: { method: GET, path: /v1/me, headers: { authorization: Bearer t1 } }, response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } } }
  - { request: { method: GET, path: /v1/me, headers: { authorization: Bearer t1 } }, response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } } }
  - { request: { method: GET, path: /v1/me, headers: { authorization: Bearer t1 } }, response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } } }
expect:
  token_exchanges: 1
