name: a-write-with-an-idempotency-key-is-retried
area: retries
summary: A POST whose operation takes Idempotency-Key gets a generated key, is retried after a 503, and sends the same key both times.
pending: [go, java, csharp]
notes: M6, docs/config.md section 7.5 (RFC 0033). Lands with the move of a-write-is-not-retried to an operation without the header (config.md section 10, step 3).
action: { op: events.create_endpoint, args: { account_id: acc_1, url: "https://example.com/hook", event_types: [radar.digest.published] } }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: POST, path: /v1/webhooks/endpoints, headers: { idempotency-key: "$ik" } }
    response: { status: 503, json: { code: unavailable, error: try again } }
  - request: { method: POST, path: /v1/webhooks/endpoints, headers: { idempotency-key: "$ik" } }
    response: { status: 200, json: { secret: whsec_1, endpoint: { id: we_1, url: "https://example.com/hook", description: "", event_types: [radar.digest.published], enabled: true, disabled_reason: "", created_at: "2026-10-04T08:00:00Z", secret_rotated_at: "", last_delivery_at: "", last_delivery_status: "", succeeded_24h: 0, failed_24h: 0 } } }
expect:
  ok: { endpoint: { id: we_1 } }
  attempts: 2
  idempotency_key: "*"
