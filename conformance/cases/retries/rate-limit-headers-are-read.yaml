name: rate-limit-headers-are-read
area: retries
summary: The edge's X-RateLimit headers become the result's rate-limit snapshot.
pending: [go, rust, py, java, csharp]
notes: M6, docs/config.md section 7.8. Envoy's draft-03 headers; Reset is seconds.
action: { op: me }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me }
    response: { status: 200, headers: { x-ratelimit-limit: "1000", x-ratelimit-remaining: "999", x-ratelimit-reset: "1" }, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
  rate_limit: { limit: 1000, remaining: 999, reset_ms: 1000 }
