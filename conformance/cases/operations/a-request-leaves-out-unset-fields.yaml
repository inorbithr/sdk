name: a-request-leaves-out-unset-fields
area: operations
summary: A request field the caller does not set is left out of the body (nothing in a request is required); a required answer field is read.
action: { op: events.create_endpoint, args: { url: "https://example.com/hook" } }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: POST, path: /v1/webhooks/endpoints, json: { url: "https://example.com/hook" }, absent: [account_id, description, event_types] }
    response: { status: 200, json: { secret: shown-once-in-the-answer, endpoint: { id: ep_1, url: "https://example.com/hook", description: "", event_types: [], enabled: true, disabled_reason: "", created_at: "2026-10-04T08:00:00Z", secret_rotated_at: "", last_delivery_at: "", last_delivery_status: "", succeeded_24h: 0, failed_24h: 0 } } }
expect:
  ok: { endpoint: { id: ep_1 } }
  attempts: 1
notes: The answer is a CreateEndpointResponse as spec/openapi.json shapes it since core #218 (secret required, endpoint optional); unset timestamps are "" (rule N5).
