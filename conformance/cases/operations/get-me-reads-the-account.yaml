name: get-me-reads-the-account
area: operations
summary: accounts.get_me answers the caller's account and teams, and a typed SDK reads the whole GetMeResponse.
action: { op: accounts.get_me }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/accounts/me }
    response:
      status: 200
      json:
        user_id: usr_1
        subject: usr_1
        email: ana@example.com
        name: Ana
        email_verified: true
        stub: false
        teams: []
        account: { id: acc_1, kind: personal, slug: ana, name: Ana, plan: free, status: active, role: owner, created_at: "2026-10-01T00:00:00Z", erase_after: "", probe: false }
expect:
  ok: { email: ana@example.com, account: { plan: free } }
  attempts: 1
notes: The answer leaves out `key`, a message field the gateway omits when it was never set; every SDK reads it as no value (design.md section 12).
