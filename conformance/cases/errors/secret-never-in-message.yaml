name: secret-never-in-message
area: errors
summary: A failed token exchange names the key id but never the secret.
client: { key_id: ak_test, key_secret: s3cr3t-do-not-print }
action: { op: me }
exchanges:
  - request: { method: POST, path: /oauth2/token }
    response: { status: 401, json: { error: invalid_client, error_description: Client authentication failed. } }
expect:
  error: { kind: auth, message_contains: ak_test, message_excludes: s3cr3t-do-not-print }
  token_exchanges: 1
notes: A refused exchange is not retried, and no API request is made, so the server counts one token exchange and no attempt.
