name: a-stored-login-refreshes-and-rotates
area: credentials
summary: With under a minute left, the session refreshes before the call, the rotated refresh token is written back, and no token reaches a log record.
pending: [go, ts, py, java, csharp, swift]
notes: "The new access token is an unsigned JWT for audience iohr-api, because a token endpoint answer is checked as the API does (the login source reads its claims). RFC 0231, docs/config.md section 5.6 (refresh at under 60 s left, rotating refresh token written before the new access token is used). Pending until each language ships its login source (Rust: slice 4)."
client:
  load: true
  env: { INORBIT_BASE_URL: "{replay}" }
  config_file: |
    default = "dev"
    [profiles.dev]
    kind = "person"
    account = "acc_1"
    storage = "keyring"
    issuer = "{replay}"
    client_id = "iohr-cli"
  log: debug
  stored_session: { profile: dev, account: acc_1, access_token: login-old, refresh_token: rt-1, expires_in_s: 30 }
action: { op: me, repeat: 2 }
exchanges:
  - request: { method: GET, path: /.well-known/openid-configuration }
    response:
      status: 200
      json:
        issuer: "{replay}"
        authorization_endpoint: "{replay}/oauth2/auth"
        token_endpoint: "{replay}/oauth2/token"
        device_authorization_endpoint: "{replay}/oauth2/device/auth"
        revocation_endpoint: "{replay}/oauth2/revoke"
  - request:
      method: POST
      path: /oauth2/token
      form: { grant_type: refresh_token, refresh_token: rt-1, client_id: iohr-cli }
    response: { status: 200, json: { access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln, refresh_token: rt-2, token_type: bearer, expires_in: 900 } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln } }
    response: { status: 200, json: { subject: usr_1, kind: user, scopes: [iohr.api] } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln } }
    response: { status: 200, json: { subject: usr_1, kind: user, scopes: [iohr.api] } }
expect:
  ok: { subject: usr_1 }
  token_exchanges: 1
  stored_session: { refresh_token: rt-2, access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln }
  logs: { excludes: [rt-1, rt-2, login-old, eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln] }
