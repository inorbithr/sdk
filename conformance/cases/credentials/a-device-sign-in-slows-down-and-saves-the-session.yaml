name: a-device-sign-in-slows-down-and-saves-the-session
area: credentials
summary: Device sign-in polls at the interval, waits 5 s longer after slow_down, and saves the session under the profile when the code is approved.
pending: [go, ts, py, java, csharp, swift]
notes: "The approving answer carries an ID token (`{id_token:iohr-cli}`, expanded by the replay server), which a sign-in checks. The new access token is an unsigned JWT for audience iohr-api, because a token endpoint answer is checked as the API does (the login source reads its claims). RFC 0231, docs/config.md section 5.6 (RFC 8628 section 3.5). Pending until each language ships its login (Rust: slice 3). The driver shows the user code and link to nobody and approves at once; the case checks the polling."
client:
  load: true
  profile: dev
  env: { INORBIT_BASE_URL: "{replay}" }
  config_file: |
    [profiles.dev]
    kind = "person"
    account = "acc_1"
    storage = "keyring"
    issuer = "{replay}"
    client_id = "iohr-cli"
action: { op: login.device }
exchanges:
  - request: { method: GET, path: /.well-known/openid-configuration }
    response:
      status: 200
      json:
        issuer: "{replay}"
        authorization_endpoint: "{replay}/oauth2/auth"
        token_endpoint: "{replay}/oauth2/token"
        device_authorization_endpoint: "{replay}/oauth2/device/auth"
        revocation_endpoint: "{replay}/oauth2/revoke"
  - request: { method: POST, path: /oauth2/device/auth, form: { client_id: iohr-cli } }
    response:
      status: 200
      json: { device_code: dc-1, user_code: ABCD-EFGH, verification_uri: "{replay}/device", expires_in: 600, interval: 1 }
  - request:
      method: POST
      path: /oauth2/token
      form: { grant_type: "urn:ietf:params:oauth:grant-type:device_code", device_code: dc-1 }
    response: { status: 400, json: { error: authorization_pending } }
  - request:
      method: POST
      path: /oauth2/token
      form: { grant_type: "urn:ietf:params:oauth:grant-type:device_code", device_code: dc-1 }
      min_delay_ms: 900
    response: { status: 400, json: { error: slow_down } }
  - request:
      method: POST
      path: /oauth2/token
      form: { grant_type: "urn:ietf:params:oauth:grant-type:device_code", device_code: dc-1 }
      min_delay_ms: 5900
    response: { status: 200, json: { access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln, refresh_token: rt-1, token_type: bearer, expires_in: 900, id_token: "{id_token:iohr-cli}" } }
expect:
  ok: {}
  stored_session: { refresh_token: rt-1, access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln }
