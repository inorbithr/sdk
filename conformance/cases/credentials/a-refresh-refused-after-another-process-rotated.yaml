name: a-refresh-refused-after-another-process-rotated
area: credentials
summary: When the service refuses the refresh token because another process rotated it, the session re-reads the store once and retries with the newer token instead of failing.
pending: [go, ts, py, java, csharp, swift]
notes: "The other process's access token has under a minute left too, so the retry with its refresh token is the only way on (a fresh one is taken as it is, never refreshed again). The new access token is an unsigned JWT for audience iohr-api, because a token endpoint answer is checked as the API does (the login source reads its claims). RFC 0231, docs/config.md section 5.6 (two processes share one entry). Pending until each language ships its login source (Rust: slice 4)."
client:
  load: true
  env: { INORBIT_BASE_URL: "{replay}" }
  config_file: |
    default = "dev"
    [profiles.dev]
    kind = "person"
    account = "acc_1"
    storage = "keyring"
    issuer = "{replay}"
    client_id = "iohr-cli"
  stored_session:
    profile: dev
    account: acc_1
    access_token: login-old
    refresh_token: rt-1
    expires_in_s: 30
    rotated_by_another_process: { access_token: login-other, refresh_token: rt-2, expires_in_s: 30 }
action: { op: me }
exchanges:
  - request: { method: GET, path: /.well-known/openid-configuration }
    response:
      status: 200
      json:
        issuer: "{replay}"
        authorization_endpoint: "{replay}/oauth2/auth"
        token_endpoint: "{replay}/oauth2/token"
        device_authorization_endpoint: "{replay}/oauth2/device/auth"
        revocation_endpoint: "{replay}/oauth2/revoke"
  - request:
      method: POST
      path: /oauth2/token
      form: { grant_type: refresh_token, refresh_token: rt-1 }
    response: { status: 400, json: { error: invalid_grant } }
  - request:
      method: POST
      path: /oauth2/token
      form: { grant_type: refresh_token, refresh_token: rt-2 }
    response: { status: 200, json: { access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln, refresh_token: rt-3, token_type: bearer, expires_in: 900 } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ1c3JfMSIsImF1ZCI6WyJpb2hyLWFwaSJdLCJqdGkiOiJsb2dpbi1uZXcifQ.c2ln } }
    response: { status: 200, json: { subject: usr_1, kind: user, scopes: [iohr.api] } }
expect:
  ok: { subject: usr_1 }
  token_exchanges: 2
  stored_session: { refresh_token: rt-3 }
