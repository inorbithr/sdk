name: an-env-token-is-sent-as-is
area: credentials
summary: With INORBIT_TOKEN set, load sends it as the bearer token and makes no token exchange.
pending: [java]
notes: M6, docs/config.md section 5.1.
client:
  load: true
  env: { INORBIT_BASE_URL: "{replay}", INORBIT_TOKEN: api-token-1, INORBIT_CONFIG_FILE: "off" }
action: { op: me }
exchanges:
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer api-token-1 } }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
  attempts: 1
  token_exchanges: 0
