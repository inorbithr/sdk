name: the-iohr-login-is-used
area: credentials
summary: With no credentials in code, the environment or the file, the default profile's iohr login supplies the token through iohr auth token.
pending: [go, rust, py, java, csharp]
notes: M6, docs/config.md section 5.4; replay feature 6 (the fake iohr answers cli-<profile>).
client:
  load: true
  cli: true
  env: { INORBIT_BASE_URL: "{replay}" }
  config_file: |
    default = "dev"
    [profiles.dev]
    kind = "person"
    account = "acc_1"
    storage = "keyring"
action: { op: me, repeat: 2 }
exchanges:
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer cli-dev } }
    response: { status: 200, json: { subject: usr_1, kind: user, scopes: [iohr.api] } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer cli-dev } }
    response: { status: 200, json: { subject: usr_1, kind: user, scopes: [iohr.api] } }
expect:
  ok: { subject: usr_1 }
  token_exchanges: 0
  config: { profile: { name: dev }, credential: { source: cli } }
