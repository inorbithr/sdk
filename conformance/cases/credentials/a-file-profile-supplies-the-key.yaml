name: a-file-profile-supplies-the-key
area: credentials
summary: INORBIT_PROFILE selects a config file profile whose key id and secret file (relative to the file) are used.
pending: [swift]
notes: M6, docs/config.md sections 2.2, 4.2 and 5.1. Pending for swift until https://github.com/inorbithr/sdk/issues/172 lands.
client:
  load: true
  env: { INORBIT_PROFILE: work }
  config_file: |
    [profiles.work]
    base_url = "{replay}"
    token_url = "{replay}/oauth2/token"
    key_id = "ak_work"
    key_secret_file = "work-secret"
    scopes = ["identity:read", "radar:read"]
  files: { work-secret: s3cr3t-work }
action: { op: me }
exchanges:
  - request: { method: POST, path: /oauth2/token, headers: { authorization: Basic YWtfd29yazpzM2NyM3Qtd29yaw== }, form: { grant_type: client_credentials, audience: iohr-api, scope: identity:read radar:read } }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer t1 } }
    response: { status: 200, json: { subject: ak_work, kind: client, scopes: [identity:read, radar:read] } }
expect:
  ok: { subject: ak_work }
  token_exchanges: 1
  config: { profile: { name: work, source: env INORBIT_PROFILE }, credential: { source: file } }
