name: env-credentials-win-over-the-file
area: credentials
summary: A key in the environment is used even when the selected file profile has one.
pending: [go, py, java, csharp]
notes: M6, docs/config.md sections 2.3 and 5.1.
client:
  load: true
  env:
    INORBIT_BASE_URL: "{replay}"
    INORBIT_TOKEN_URL: "{replay}/oauth2/token"
    INORBIT_KEY_ID: ak_test
    INORBIT_KEY_SECRET: s3cr3t
    INORBIT_SCOPES: identity:read
  config_file: |
    default = "work"
    [profiles.work]
    key_id = "ak_work"
    key_secret_file = "work-secret"
    scopes = ["radar:read"]
  files: { work-secret: s3cr3t-work }
action: { op: me }
exchanges:
  - request: { method: POST, path: /oauth2/token, headers: { authorization: Basic YWtfdGVzdDpzM2NyM3Q= }, form: { scope: identity:read } }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer t1 } }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
  config: { credential: { source: env } }
