name: a-token-file-is-read-again-after-a-401
area: credentials
summary: A token file rewritten after the first call is read again when the API refuses the old token.
pending: [java]
notes: M6, docs/config.md section 5.3. The file's modification time is checked at most once a minute, so the second call still sends the old token first.
client:
  load: true
  env: { INORBIT_BASE_URL: "{replay}", INORBIT_CONFIG_FILE: "off", INORBIT_TOKEN_FILE: "{dir}/token" }
  files: { token: tok-1 }
action: { op: me, repeat: 2, rewrite: { after: 1, files: { token: tok-2 } } }
exchanges:
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer tok-1 } }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer tok-1 } }
    response: { status: 401, text: "Jwt is expired" }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer tok-2 } }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
  attempts: 3
  token_exchanges: 0
