name: a-key-secret-file-is-read-before-each-exchange
area: credentials
summary: A rotated key secret file is used at the next token exchange, without a new client.
pending: [go, rust, ts, py, java, csharp]
notes: M6, docs/config.md section 5.3. The second call's 401 forces the exchange; the Basic credentials carry the rotated secret.
client:
  load: true
  env:
    INORBIT_BASE_URL: "{replay}"
    INORBIT_TOKEN_URL: "{replay}/oauth2/token"
    INORBIT_CONFIG_FILE: "off"
    INORBIT_KEY_ID: ak_test
    INORBIT_KEY_SECRET_FILE: "{dir}/key-secret"
    INORBIT_SCOPES: identity:read
  files: { key-secret: s3cr3t }
action: { op: me, repeat: 2, rewrite: { after: 1, files: { key-secret: s3cr3t-rotated } } }
exchanges:
  - request: { method: POST, path: /oauth2/token, headers: { authorization: Basic YWtfdGVzdDpzM2NyM3Q= } }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer t1 } }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer t1 } }
    response: { status: 401, json: { code: unauthenticated, error: authentication required, details: [] } }
  - request: { method: POST, path: /oauth2/token, headers: { authorization: Basic YWtfdGVzdDpzM2NyM3Qtcm90YXRlZA== } }
    response: { status: 200, json: { access_token: t2, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer t2 } }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
  attempts: 3
  token_exchanges: 2
