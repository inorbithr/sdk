name: signing-out-revokes-and-deletes-the-entry
area: credentials
summary: Sign-out revokes the refresh token at the revocation endpoint, then deletes the store entry.
pending: [go, ts, py, java, csharp, swift]
notes: "RFC 0231, docs/config.md section 5.6 (sign-out). Pending until each language ships its login (Rust: slice 3)."
client:
  load: true
  env: { INORBIT_BASE_URL: "{replay}" }
  config_file: |
    default = "dev"
    [profiles.dev]
    kind = "person"
    account = "acc_1"
    storage = "keyring"
    issuer = "{replay}"
    client_id = "iohr-cli"
  stored_session: { profile: dev, account: acc_1, access_token: login-dev, refresh_token: rt-1, expires_in_s: 900 }
action: { op: login.sign_out }
exchanges:
  - request: { method: GET, path: /.well-known/openid-configuration }
    response:
      status: 200
      json:
        issuer: "{replay}"
        authorization_endpoint: "{replay}/oauth2/auth"
        token_endpoint: "{replay}/oauth2/token"
        device_authorization_endpoint: "{replay}/oauth2/device/auth"
        revocation_endpoint: "{replay}/oauth2/revoke"
  - request:
      method: POST
      path: /oauth2/revoke
      form: { token: rt-1, token_type_hint: refresh_token, client_id: iohr-cli }
    response: { status: 200, json: {} }
expect:
  ok: {}
  stored_session: absent
