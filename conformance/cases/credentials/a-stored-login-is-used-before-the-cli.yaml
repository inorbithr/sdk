name: a-stored-login-is-used-before-the-cli
area: credentials
summary: With a person's session in the store and iohr present, the login source supplies the token itself; the cli source is never run.
pending: [go, rust, ts, py, java, csharp, swift]
notes: "RFC 0231, docs/config.md section 5.6. Pending until each language ships its login source (Rust: slice 4 of RFC 0231, the SDK's 0.4.1); the other languages follow from this case. Beside the-iohr-login-is-used, which stays the case for a machine with no stored session."
client:
  load: true
  env: { INORBIT_BASE_URL: "{replay}" }
  config_file: |
    default = "dev"
    [profiles.dev]
    kind = "person"
    account = "acc_1"
    storage = "keyring"
    issuer = "{replay}"
    client_id = "iohr-cli"
  cli: true
  stored_session: { profile: dev, account: acc_1, access_token: login-dev, refresh_token: rt-1, expires_in_s: 900 }
action: { op: me, repeat: 2 }
exchanges:
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer login-dev } }
    response: { status: 200, json: { subject: usr_1, kind: user, scopes: [iohr.api] } }
  - request: { method: GET, path: /v1/me, headers: { authorization: Bearer login-dev } }
    response: { status: 200, json: { subject: usr_1, kind: user, scopes: [iohr.api] } }
expect:
  ok: { subject: usr_1 }
  token_exchanges: 0
  config: { profile: { name: dev }, credential: { source: login } }
