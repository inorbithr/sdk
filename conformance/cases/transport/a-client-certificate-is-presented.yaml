name: a-client-certificate-is-presented
area: transport
summary: Against a server that requires one, the client presents the configured client certificate.
pending: [swift]
notes: M6, docs/config.md section 6.4; replay feature 3. Pending for swift until https://github.com/inorbithr/sdk/issues/172 lands.
client: { transport: mtls }
action: { op: me }
exchanges:
  - request: { method: POST, path: /oauth2/token, client_cert: CN=conformance-client }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me, client_cert: CN=conformance-client }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
