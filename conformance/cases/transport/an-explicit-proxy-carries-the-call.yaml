name: an-explicit-proxy-carries-the-call
area: transport
summary: An explicit proxy carries both the token exchange and the call, through CONNECT.
pending: [swift]
notes: M6, docs/config.md section 6.2; replay features 2 and 4. An explicit proxy applies to loopback. Pending for swift until https://github.com/inorbithr/sdk/issues/172 lands.
client: { transport: proxy }
action: { op: me }
exchanges:
  - request: { method: POST, path: /oauth2/token, via: proxy }
    response: { status: 200, json: { access_token: t1, token_type: bearer, expires_in: 899 } }
  - request: { method: GET, path: /v1/me, via: proxy }
    response: { status: 200, json: { subject: ak_test, kind: client, scopes: [identity:read] } }
expect:
  ok: { subject: ak_test }
