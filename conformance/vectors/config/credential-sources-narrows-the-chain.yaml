name: credential-sources-narrows-the-chain
kind: config
summary: INORBIT_CREDENTIAL_SOURCES=file skips the environment's token and uses the file's.
pending: [go, py, java, csharp]
input:
  env: { INORBIT_TOKEN: t, INORBIT_CREDENTIAL_SOURCES: file, INORBIT_PROFILE: w }
  config_file: |
    [profiles.w]
    token_file = "tok"
  files: { tok: abc }
expect:
  credential:
    source: file
    tried:
      - { source: code, result: skipped }
      - { source: env, result: skipped, reason: not in credential_sources }
      - { source: workload, result: skipped }
      - { source: file, result: used }
