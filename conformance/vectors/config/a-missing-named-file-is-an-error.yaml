name: a-missing-named-file-is-an-error
kind: config
summary: A config file named by INORBIT_CONFIG_FILE that does not exist fails the load.
pending: [java]
input:
  env: { INORBIT_TOKEN: t, INORBIT_CONFIG_FILE: "{dir}/missing.toml" }
expect:
  error:
    kind: config
    problems: [{ setting: config_file, source: env INORBIT_CONFIG_FILE, message_contains: missing.toml }]
