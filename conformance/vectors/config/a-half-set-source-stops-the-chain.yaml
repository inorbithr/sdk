name: a-half-set-source-stops-the-chain
kind: config
summary: A key id without a secret in the environment is reported, even though the file has a usable token.
pending: [go, py, java, csharp]
input:
  env: { INORBIT_KEY_ID: ak_1, INORBIT_PROFILE: w }
  config_file: |
    [profiles.w]
    token_file = "tok"
  files: { tok: abc }
expect:
  error:
    kind: config
    problems: [{ setting: key_secret, message_contains: INORBIT_KEY_SECRET }]
