name: the-cli-source-uses-a-login-profile
kind: config
summary: With iohr present and a profile it made, the chain ends at the cli source; scopes are listed as ignored.
pending: [java]
input:
  cli: present
  env: { INORBIT_SCOPES: identity:read }
  config_file: |
    default = "dev"
    [profiles.dev]
    kind = "person"
    account = "acc_1"
expect:
  credential: { source: cli, kind: cli }
  ignored:
    - { key: scopes, source: env INORBIT_SCOPES, reason: not used by this credential }
