name: a-typed-profile-never-reads-bare-credentials
kind: config
summary: A typed profile ignores INORBIT_TOKEN and fails naming its own variables.
pending: [java, csharp]
input:
  profile_type: acme-ci
  env: { INORBIT_TOKEN: t, INORBIT_CONFIG_FILE: "off" }
expect:
