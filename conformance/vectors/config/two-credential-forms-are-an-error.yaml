name: two-credential-forms-are-an-error
kind: config
summary: A token and a key in the same source is an error, not a choice.
pending: [go, java, csharp]
input:
  env: { INORBIT_CONFIG_FILE: "off", INORBIT_TOKEN: t, INORBIT_KEY_ID: ak_1, INORBIT_KEY_SECRET: s, INORBIT_SCOPES: identity:read }
expect:
  error:
    kind: config
    problems: [{ setting: token, source: env INORBIT_TOKEN, message_contains: INORBIT_KEY_ID }]
