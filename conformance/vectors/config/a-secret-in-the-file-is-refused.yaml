name: a-secret-in-the-file-is-refused
kind: config
summary: A key secret written into the config file fails the load, names the way out, and never echoes the value.
pending: [java, csharp]
input:
  env: { INORBIT_PROFILE: work }
  config_file: |
    [profiles.work]
    key_id = "ak_work"
    key_secret = "x-secret-value"
    scopes = ["identity:read"]
expect:
  error:
    kind: config
    problems: [{ setting: key_secret, source: "file {file} [profiles.work]", message_contains: key_secret_file }]
  excludes: [x-secret-value]
