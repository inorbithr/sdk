name: a-proxy-password-in-the-file-is-refused
kind: config
summary: A proxy URL with user-info in the config file fails the load without echoing the password.
pending: [go, java, csharp]
input:
  env: { INORBIT_TOKEN: t }
  config_file: |
    [sdk]
    proxy = "http://ana:pw-do-not-print@proxy.example:3128"
expect:
  error:
    kind: config
    problems: [{ setting: proxy, source: "file {file} [sdk]" }]
  excludes: [pw-do-not-print]
