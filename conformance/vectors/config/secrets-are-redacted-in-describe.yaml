name: secrets-are-redacted-in-describe
kind: config
summary: describe() shows the key id but redacts the key secret and a proxy password.
input:
  env:
    INORBIT_CONFIG_FILE: "off"
    INORBIT_KEY_ID: ak_shown
    INORBIT_KEY_SECRET: s3cr3t-do-not-print
    INORBIT_SCOPES: identity:read
    INORBIT_PROXY: "http://ana:pw-do-not-print@proxy.example:3128"
expect:
  settings:
    key_id: { value: ak_shown }
    key_secret: { value: "<redacted>", source: env INORBIT_KEY_SECRET }
    proxy: { value: "http://<redacted>@proxy.example:3128", source: env INORBIT_PROXY }
  credential: { source: env, kind: client_credentials }
  excludes: [s3cr3t-do-not-print, pw-do-not-print]
