name: a-typed-profile-ignores-inorbit-profile
kind: config
summary: INORBIT_PROFILE cannot point a typed profile at another table.
pending: [go, rust, ts, py, java, csharp]
input:
  profile_type: acme-ci
  env: { INORBIT_ACME_CI_TOKEN: t, INORBIT_PROFILE: other }
  config_file: |
    [profiles.acme-ci]
    timeout = "3s"
    [profiles.other]
    timeout = "9s"
expect:
  profile: { name: acme-ci }
  settings:
    timeout: { value: 3s, source: "file {file} [profiles.acme-ci]" }
