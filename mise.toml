# Toolchains and tasks. `mise install`, then `mise run ci` runs what CI runs.
# CI matrix cells override one tool with MISE_<TOOL>_VERSION (ADR 0005).
# A language task skips with exit 0 until that language's manifest exists.
# Every task runs in bash with errexit and pipefail on every OS (`shell` below); Windows
# would otherwise use cmd, and project config may not change mise's default shell.

[settings]
experimental = true
cargo.binstall = true

[tools]
go = "1.27.1"
rust = { version = "1.98.1", components = "rustfmt,clippy" }
node = "24.21.0"
pnpm = "12.8.2"
python = "3.14"
uv = "0.12.21"

golangci-lint = "2.14.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.0"
"go:golang.org/x/exp/cmd/gorelease" = "latest"
"go:github.com/oasdiff/oasdiff" = "1.32.1"
# Cargo tools install as prebuilt binaries through cargo-binstall, not from source.
cargo-binstall = "1.24.0"
"cargo:cargo-nextest" = "0.9.146"
"cargo:cargo-semver-checks" = "0.50.0"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-fuzz" = "0.13.2"
cargo-deny = "0.20.2"
"cargo:cargo-cyclonedx" = "0.5.9"
"cargo:cargo-deb" = "3.8.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"go:github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod" = "1.12.0"
osv-scanner = "2.6.0"
cyclonedx = "0.33.1"
biome = "2.5.15"
typos = "1.50.3"
shellcheck = "0.11.0"
actionlint = "1.7.12"
zizmor = "1.30.1"

[env]
# Keep agent and CI output plain.
NO_COLOR = "1"
CARGO_TERM_COLOR = "never"

# ---------------------------------------------------------------- aggregate

[tasks.ci]
description = "Everything CI checks, in the same order"
depends = ["repo:check", "spec:lint", "conformance:validate", "conformance:server:check", "audit", "gen:check", "go:check", "rust:check", "ts:check", "py:check", "cli:check", "conformance", "examples:check"]

[tasks.check]
description = "Format check, lint, types and unit tests for every language and the command line"
depends = ["go:check", "rust:check", "ts:check", "py:check", "cli:check"]

[tasks.fmt]
description = "Format every language and the command line in place"
depends = ["go:fmt", "rust:fmt", "ts:fmt", "py:fmt", "cli:fmt"]

[tasks.gen]
description = "Regenerate every generated/ directory from spec/"
depends = ["go:gen", "rust:gen", "ts:gen", "py:gen"]

[tasks."gen:check"]
shell = "bash -e -o pipefail -c"
description = "Fail if regenerating from spec/ changes any committed file"
run = """
mise run gen
git diff --exit-code -- go rust typescript python || {
  echo "generated code is stale: run 'mise run gen' and commit the result" >&2; exit 1; }
"""

# ---------------------------------------------------------------- repository

[tasks."repo:check"]
shell = "bash -e -o pipefail -c"
description = "Spelling, workflow lint and workflow security audit"
run = [
  "typos",
  "actionlint",
  "zizmor --min-severity low .github/workflows",
  "python3 tools/check-repo.py",
]

# ---------------------------------------------------------------- supply chain
# Known-vulnerability scans and SBOMs (docs/security/, compliance evidence). Each language
# task skips until its package exists; `audit` also scans every lockfile with OSV.

[tasks.audit]
description = "Known-vulnerability scans: OSV over every lockfile, plus each language's own scanner"
depends = ["audit:osv", "go:audit", "rust:audit", "ts:audit", "py:audit", "cli:audit"]

[tasks."audit:osv"]
description = "OSV-Scanner over every lockfile in the repository"
shell = "bash -e -o pipefail -c"
run = """
locks=$(git ls-files '*go.sum' '*Cargo.lock' '*pnpm-lock.yaml' '*package-lock.json' '*uv.lock' | head -1)
[ -n "$locks" ] || { echo "audit: no lockfiles yet, skipping OSV scan"; exit 0; }
osv-scanner scan source --recursive .
"""

[tasks.sbom]
description = "CycloneDX SBOM for every package into dist/sbom/, then validate them"
depends = ["go:sbom", "rust:sbom", "ts:sbom", "py:sbom", "cli:sbom"]
depends_post = ["sbom:validate"]

[tasks."sbom:validate"]
description = "Validate every SBOM in dist/sbom/ against the CycloneDX schema"
shell = "bash -e -o pipefail -c"
run = """
found=0
for f in dist/sbom/*.cdx.json; do
  [ -e "$f" ] || continue
  found=1
  cyclonedx validate --input-file "$f" --input-format json --fail-on-errors
done
[ "$found" = 1 ] || echo "sbom: no packages yet, skipping"
"""

[tasks."go:audit"]
dir = "go"
shell = "bash -e -o pipefail -c"
run = "[ -f go.mod ] || { echo 'go:audit: no module yet, skipping'; exit 0; }; govulncheck ./..."

[tasks."go:sbom"]
dir = "go"
shell = "bash -e -o pipefail -c"
run = "[ -f go.mod ] || exit 0; mkdir -p ../dist/sbom; cyclonedx-gomod mod -licenses -json -output ../dist/sbom/go.cdx.json"

[tasks."rust:audit"]
dir = "rust"
shell = "bash -e -o pipefail -c"
run = "[ -f Cargo.toml ] || { echo 'rust:audit: no crate yet, skipping'; exit 0; }; cargo deny check advisories"

[tasks."rust:sbom"]
dir = "rust"
shell = "bash -e -o pipefail -c"
run = "[ -f Cargo.toml ] || exit 0; mkdir -p ../dist/sbom; cargo cyclonedx --format json --override-filename rust.cdx && mv rust.cdx.json ../dist/sbom/"

[tasks."ts:audit"]
dir = "typescript"
shell = "bash -e -o pipefail -c"
run = """
[ -f package.json ] || { echo 'ts:audit: no package yet, skipping'; exit 0; }
pnpm install --frozen-lockfile
pnpm audit --prod
npm audit signatures
"""

[tasks."ts:sbom"]
dir = "typescript"
shell = "bash -e -o pipefail -c"
run = "[ -f package.json ] || exit 0; mkdir -p ../dist/sbom; npm sbom --sbom-format cyclonedx --omit dev > ../dist/sbom/typescript.cdx.json"

[tasks."py:audit"]
dir = "python"
shell = "bash -e -o pipefail -c"
run = """
[ -f pyproject.toml ] || { echo 'py:audit: no package yet, skipping'; exit 0; }
uv export --no-dev --no-emit-project --format requirements-txt --no-hashes > "${TMPDIR:-/tmp}/py-reqs.txt"
uvx pip-audit@2.10.1 --strict --requirement "${TMPDIR:-/tmp}/py-reqs.txt"
"""

[tasks."py:sbom"]
dir = "python"
shell = "bash -e -o pipefail -c"
run = """
[ -f pyproject.toml ] || exit 0
mkdir -p ../dist/sbom
uv export --no-dev --no-emit-project --format requirements-txt > "${TMPDIR:-/tmp}/py-reqs.txt"
uvx --from cyclonedx-bom@7.5.0 cyclonedx-py requirements "${TMPDIR:-/tmp}/py-reqs.txt" --output-format JSON --output-file ../dist/sbom/python.cdx.json
"""

# ---------------------------------------------------------------- spec

[tasks."spec:sync"]
shell = "bash -e -o pipefail -c"
description = "Fetch the public API contract, filter, normalise and write spec/"
run = """
[ -f tools/spec-sync.py ] || { echo "spec:sync: tools/spec-sync.py not written yet (see spec/README.md)"; exit 0; }
uv run --script tools/spec-sync.py
"""

[tasks."spec:lint"]
shell = "bash -e -o pipefail -c"
description = "Validate spec/ and report breaking changes against main"
run = """
for f in spec/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
[ -f spec/openapi.json ] || { echo "spec:lint: no openapi.json yet, JSON checks only"; exit 0; }
base=$(git show origin/main:spec/openapi.json 2>/dev/null) || { echo "spec:lint: no openapi.json on main yet"; exit 0; }
printf '%s' "$base" > "${TMPDIR:-/tmp}/openapi-main.json"
oasdiff breaking "${TMPDIR:-/tmp}/openapi-main.json" spec/openapi.json --fail-on ERR
"""

# ---------------------------------------------------------------- Go

[tasks."go:check"]
shell = "bash -e -o pipefail -c"
description = "Go: gofmt, vet, golangci-lint, tests with the race detector"
dir = "go"
run = """
[ -f go.mod ] || { echo "go: no module yet, skipping"; exit 0; }
test -z "$(gofmt -l .)" || { gofmt -l .; echo "go: run 'mise run go:fmt'" >&2; exit 1; }
go vet ./...
golangci-lint run
go test -race ./...
"""

[tasks."go:fmt"]
shell = "bash -e -o pipefail -c"
dir = "go"
run = "[ -f go.mod ] || exit 0; gofmt -w ."

[tasks."go:gen"]
shell = "bash -e -o pipefail -c"
dir = "go"
run = "[ -f go.mod ] && [ -f ../spec/openapi.json ] || exit 0; go generate ./..."

[tasks."go:api"]
shell = "bash -e -o pipefail -c"
description = "Go: check the API change against the last go/v tag"
dir = "go"
run = """
[ -f go.mod ] || exit 0
base=$(git describe --tags --abbrev=0 --match 'go/v*' 2>/dev/null) || { echo "go:api: no release yet"; exit 0; }
gorelease -base="${base#go/}"
"""

# ---------------------------------------------------------------- Rust

[tasks."rust:check"]
shell = "bash -e -o pipefail -c"
description = "Rust: fmt, clippy, nextest, doctests, cargo-deny"
dir = "rust"
run = """
[ -f Cargo.toml ] || { echo "rust: no crate yet, skipping"; exit 0; }
cargo fmt --check
cargo clippy --locked --all-targets --all-features -- -D warnings
cargo nextest run --locked --all-features
cargo test --locked --doc --all-features
cargo deny check
"""

[tasks."rust:fmt"]
shell = "bash -e -o pipefail -c"
dir = "rust"
run = "[ -f Cargo.toml ] || exit 0; cargo fmt"

[tasks."rust:gen"]
shell = "bash -e -o pipefail -c"
description = "Rust: regenerate the public surface in rust/src/generated/ from spec/openapi.json with the command line's generator (ADR 0011)"
dir = "rust"
run = """
[ -f Cargo.toml ] && [ -f ../spec/openapi.json ] || exit 0
# The generator is `iohr sdk generate`, in cli/ (iohr-codegen); until it lands there is
# nothing to regenerate and the task says so.
grep -q 'name = "iohr-codegen"' ../cli/crates/iohr-codegen/Cargo.toml 2>/dev/null || { echo "rust:gen: the generator (cli/crates/iohr-codegen) is not here yet; nothing to regenerate"; exit 0; }
cargo run -q --manifest-path ../cli/Cargo.toml -p iohr -- sdk generate --lang rust --from public=../spec/openapi.json --in-crate --out src/generated --force
"""

[tasks."rust:features"]
shell = "bash -e -o pipefail -c"
description = "Rust: build every feature on its own"
dir = "rust"
run = "[ -f Cargo.toml ] || exit 0; cargo hack check --each-feature --no-dev-deps"

[tasks."rust:api"]
shell = "bash -e -o pipefail -c"
description = "Rust: semver check against the last rust/v tag"
dir = "rust"
run = """
[ -f Cargo.toml ] || exit 0
base=$(git describe --tags --abbrev=0 --match 'rust/v*' 2>/dev/null) || { echo "rust:api: no release yet"; exit 0; }
cargo semver-checks --baseline-rev "$base"
"""

# ---------------------------------------------------------------- command line (ADR 0009)

[tasks."cli:check"]
shell = "bash -e -o pipefail -c"
description = "Command line: fmt, clippy, nextest, doctests, cargo-deny"
dir = "cli"
run = """
cargo fmt --check
cargo clippy --locked --all-targets --all-features -- -D warnings
cargo nextest run --locked --all-features
cargo test --locked --doc --all-features
cargo deny check
"""

[tasks."cli:fmt"]
shell = "bash -e -o pipefail -c"
dir = "cli"
run = "cargo fmt"

[tasks."cli:audit"]
shell = "bash -e -o pipefail -c"
dir = "cli"
run = "cargo deny check advisories"

[tasks."cli:keyring"]
shell = "bash -e -o pipefail -c"
description = "Command line, Linux: the credential-store test against a real Secret Service in a private D-Bus session"
dir = "cli"
run = """
command -v dbus-run-session >/dev/null && command -v gnome-keyring-daemon >/dev/null || {
  echo "cli:keyring: needs dbus-run-session and gnome-keyring-daemon" >&2; exit 1; }
# A throwaway keyring in a temporary directory, never the user's own.
keyrings=$(mktemp -d)
trap 'rm -rf "$keyrings"' EXIT
dbus-run-session -- bash -e -o pipefail -c "
  printf iohr-test | XDG_DATA_HOME='$keyrings' gnome-keyring-daemon --unlock --components=secrets >/dev/null
  IOHR_TEST_REQUIRE_STORE=1 cargo nextest run --locked -p iohr-auth -E 'test(os_credential_store)'
"
"""

[tasks."cli:hydra"]
shell = "bash -e -o pipefail -c"
description = "Command line: browser and device sign-in, refresh and revocation against a real Ory Hydra (the version the platform runs), in Docker"
dir = "cli"
run = """
# The version core pins in devops/k8s/auth/hydra.yaml, by digest.
image="oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9"
name="iohr-hydra-$$"
free_port() { python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])'; }
port=$(free_port); aport=$(free_port)
public="http://127.0.0.1:$port"; admin="http://127.0.0.1:$aport"
trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
# Login, consent and device pages point nowhere: the test accepts each step through
# the admin API, as the platform's sign-in pages do.
docker run -d --name "$name" -p "127.0.0.1:$port:4444" -p "127.0.0.1:$aport:4445" \\
  -e DSN=memory -e SECRETS_SYSTEM="$(head -c 32 /dev/urandom | base64)" -e STRATEGIES_ACCESS_TOKEN=jwt \\
  -e URLS_SELF_ISSUER="$public" -e URLS_SELF_PUBLIC="$public" \\
  -e URLS_LOGIN=http://127.0.0.1:9/login -e URLS_CONSENT=http://127.0.0.1:9/consent \\
  -e URLS_DEVICE_VERIFICATION=http://127.0.0.1:9/device -e URLS_DEVICE_SUCCESS=http://127.0.0.1:9/device/done \\
  "$image" serve all --dev >/dev/null
for _ in $(seq 1 60); do curl -fs "$public/health/ready" >/dev/null && break; sleep 1; done
IOHR_TEST_REQUIRE_HYDRA=1 IOHR_TEST_HYDRA="$public" IOHR_TEST_HYDRA_ADMIN="$admin" \\
  cargo nextest run --locked -p iohr-auth -E 'binary(hydra)'
"""

[tasks."cli:compile-test"]
shell = "bash -e -o pipefail -c"
description = "Command line: generate a two-profile surface, build it against rust/, and prove the wrong profile does not compile (slow; CI runs it on Linux)"
dir = "cli"
run = "IOHR_TEST_COMPILE=1 cargo nextest run --locked -p iohr-codegen --test compile"

[tasks."cli:normalise-golden"]
shell = "bash -e -o pipefail -c"
description = "Regenerate the normaliser's golden fixture pair from the fixture's raw document with tools/spec-sync.py, so the Rust port stays byte-equal to the sync tool"
run = """
fixtures=cli/crates/iohr-openapi/tests/fixtures/normalise
tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
mkdir -p "$tmp/tools" "$tmp/spec"
cp tools/spec-sync.py "$tmp/tools/"
uv run --script "$tmp/tools/spec-sync.py" "$fixtures/raw-public.json" >/dev/null
cp "$tmp/spec/openapi.json" "$fixtures/expected-openapi.json"
cp "$tmp/spec/problem.json" "$fixtures/expected-problem.json"
echo "cli:normalise-golden: fixtures regenerated from $fixtures/raw-public.json"
"""

[tasks."cli:fuzz"]
shell = "bash -e -o pipefail -c"
description = "Command line: fuzz the config, error, token and loopback request readers (nightly; FUZZ_SECONDS each, default 60)"
dir = "cli"
run = """
rustup toolchain list | grep -q '^nightly' || rustup toolchain install nightly --profile minimal --no-self-update
# The prebuilt cargo-fuzz defaults to the target it was built for (musl); use the host's.
host=$(rustc +nightly -vV | sed -n 's/^host: //p')
for target in config problem claims loopback; do
  cargo +nightly fuzz run --target "$host" "$target" -- -max_total_time="${FUZZ_SECONDS:-60}"
done
"""

[tasks."cli:dist"]
shell = "bash -e -o pipefail -c"
description = "Command line release build for one target into dist/cli/: the archive, plus the .deb on Linux and the .msi on Windows (ADR 0010)"
run = "bash cli/release/dist.sh"

[tasks."cli:sboms"]
shell = "bash -e -o pipefail -c"
description = "Command line: one CycloneDX SBOM per release target, beside the archives in dist/cli/, each validated"
dir = "cli"
run = """
version=$(cargo pkgid -p iohr | sed 's/.*[#@]//')
for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
  cargo cyclonedx --format json --manifest-path crates/iohr/Cargo.toml --target "$target" --override-filename "iohr-$version-$target.cdx"
  mv "crates/iohr/iohr-$version-$target.cdx.json" ../dist/cli/
  # cargo-cyclonedx writes one for every workspace member; only the binary's is released.
  rm -f crates/iohr-auth/*.cdx.json crates/iohr-openapi/*.cdx.json crates/iohr-codegen/*.cdx.json
  cyclonedx validate --input-file "../dist/cli/iohr-$version-$target.cdx.json" --input-format json --fail-on-errors
done
"""

[tasks."cli:checksums"]
shell = "bash -e -o pipefail -c"
description = "Command line: SHA256SUMS over every file in dist/cli/"
dir = "dist/cli"
run = "rm -f SHA256SUMS && sha256sum -- * >SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS && cat SHA256SUMS"

[tasks."cli:installers"]
shell = "bash -e -o pipefail -c"
description = "Command line installers and release scripts: shellcheck them; parse install.ps1 when PowerShell is here"
dir = "cli/install"
run = """
shellcheck --shell=sh install.sh
shellcheck ../release/*.sh
if command -v pwsh >/dev/null; then
  pwsh -NoProfile -Command '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$e) | Out-Null; if ($e) { $e; exit 1 }'
else
  echo "cli:installers: no pwsh here, install.ps1 not parsed (CI's Linux runner has it)"
fi
"""

[tasks."cli:install-test"]
shell = "bash -e -o pipefail -c"
description = "Command line installers against a published release (IOHR_VERSION, default the newest): install.sh in Debian on Linux, natively on macOS; install.ps1 on Windows"
run = """
case "$(uname -s)" in
  Linux)
    docker run --rm -e IOHR_VERSION -v "$PWD/cli/install:/install:ro" debian:stable-slim sh -euc '
      apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
      sh /install/install.sh
      "$HOME/.local/bin/iohr" --version'
    ;;
  Darwin)
    IOHR_INSTALL_DIR=$(mktemp -d) sh cli/install/install.sh
    ;;
  MINGW* | MSYS*)
    IOHR_INSTALL_DIR=$(mktemp -d) powershell -NoProfile -ExecutionPolicy Bypass -File cli/install/install.ps1
    ;;
esac
"""

[tasks."cli:tap"]
shell = "bash -e -o pipefail -c"
description = "Command line: propose a release's Homebrew formula to inorbithr/homebrew-tap (needs GH_TOKEN for the tap)"
run = "bash cli/release/tap.sh"

[tasks."cli:apt"]
shell = "bash -e -o pipefail -c"
description = "Command line: the signed APT repository from dist/cli/*.deb into dist/apt/ (APT_SIGNING_KEY, APT_SIGNING_KEY_ID, APT_SIGNING_PASSPHRASE); --publish uploads it to the packages bucket"
run = "bash cli/release/apt.sh"

[tasks."cli:apt-test"]
shell = "bash -e -o pipefail -c"
description = "Command line: install iohr in a clean Debian from https://packages.inorbit.hr exactly as the docs say (IOHR_VERSION, when set, must be what installs)"
run = """
docker run --rm -e IOHR_VERSION debian:stable-slim sh -euc '
  apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
  install -d -m 0755 /etc/apt/keyrings
  curl -fsSL https://packages.inorbit.hr/iohr.gpg | tee /etc/apt/keyrings/iohr.gpg >/dev/null
  printf "Types: deb\nURIs: https://packages.inorbit.hr/apt\nSuites: stable\nComponents: main\nSigned-By: /etc/apt/keyrings/iohr.gpg\n" >/etc/apt/sources.list.d/iohr.sources
  apt-get update -qq
  apt-get install -y -qq iohr >/dev/null
  iohr --version
  if [ -n "${IOHR_VERSION:-}" ]; then iohr --version | grep -qx "iohr $IOHR_VERSION"; fi'
"""

[tasks."cli:winget"]
shell = "bash -e -o pipefail -c"
description = "Command line: winget manifests for a release from dist/cli/ (the .msi files, SHA256SUMS) into dist/winget/, checked against winget's schemas"
run = "bash cli/release/winget.sh"

[tasks."cli:sbom"]
dir = "cli"
shell = "bash -e -o pipefail -c"
run = "mkdir -p ../dist/sbom && cargo cyclonedx --format json --manifest-path crates/iohr/Cargo.toml --override-filename cli.cdx && mv crates/iohr/cli.cdx.json ../dist/sbom/ && rm -f crates/iohr-auth/*.cdx.json crates/iohr-openapi/*.cdx.json crates/iohr-codegen/*.cdx.json"

# ---------------------------------------------------------------- TypeScript

[tasks."ts:check"]
shell = "bash -e -o pipefail -c"
description = "TypeScript: biome, tsc, vitest, publint, attw, api-extractor"
dir = "typescript"
run = """
[ -f package.json ] || { echo "ts: no package yet, skipping"; exit 0; }
pnpm install --frozen-lockfile
pnpm run check
"""

[tasks."ts:fmt"]
shell = "bash -e -o pipefail -c"
dir = "typescript"
run = "[ -f package.json ] || exit 0; biome format --write ."

[tasks."ts:gen"]
shell = "bash -e -o pipefail -c"
dir = "typescript"
run = "[ -f package.json ] && [ -f ../spec/openapi.json ] || exit 0; pnpm run gen"

# ---------------------------------------------------------------- Python

[tasks."py:check"]
shell = "bash -e -o pipefail -c"
description = "Python: ruff, pyright, mypy, pytest"
dir = "python"
run = """
[ -f pyproject.toml ] || { echo "py: no package yet, skipping"; exit 0; }
uv sync --locked
uv run ruff format --check
uv run ruff check
uv run pyright
uv run mypy --strict src
uv run pytest
"""

[tasks."py:fmt"]
shell = "bash -e -o pipefail -c"
dir = "python"
run = "[ -f pyproject.toml ] || exit 0; uv run ruff format && uv run ruff check --fix"

[tasks."py:gen"]
shell = "bash -e -o pipefail -c"
dir = "python"
run = "[ -f pyproject.toml ] && [ -f ../spec/openapi.json ] || exit 0; uv run python tools/gen.py"

[tasks."py:api"]
shell = "bash -e -o pipefail -c"
description = "Python: griffe check against the last python/v tag"
dir = "python"
run = """
[ -f pyproject.toml ] || exit 0
base=$(git describe --tags --abbrev=0 --match 'python/v*' 2>/dev/null) || { echo "py:api: no release yet"; exit 0; }
uv run griffe check inorbithr --search src --against "$base"
"""

# ---------------------------------------------------------------- conformance and examples

[tasks.conformance]
description = "Run the shared conformance cases in every language"
depends = ["conformance:go", "conformance:rust", "conformance:ts", "conformance:py"]

[tasks."conformance:server"]
shell = "bash -e -o pipefail -c"
description = "Run the replay server; it prints its address (--addr to choose one)"
dir = "conformance/server"
run = "go run . --cases ../cases"

[tasks."conformance:server:build"]
shell = "bash -e -o pipefail -c"
description = "Build the replay server to conformance/server/bin/replay for the language drivers"
dir = "conformance/server"
run = "go build -trimpath -o bin/replay ."

[tasks."conformance:server:check"]
shell = "bash -e -o pipefail -c"
description = "Replay server: gofmt, vet, golangci-lint, and the self-test that replays every case"
dir = "conformance/server"
run = """
test -z "$(gofmt -l .)" || { gofmt -l .; echo "conformance:server: run gofmt -w ." >&2; exit 1; }
go vet ./...
golangci-lint run
go test -race -count=1 ./...
"""

[tasks."conformance:validate"]
shell = "bash -e -o pipefail -c"
description = "Validate every case file against conformance/case.schema.json"
run = "uv run --with pyyaml --with jsonschema python tools/validate-cases.py"

[tasks."conformance:go"]
shell = "bash -e -o pipefail -c"
run = "[ -e conformance/server ] && [ -f go/go.mod ] || { echo 'conformance:go: skipping (no server or no module yet)'; exit 0; }; cd go && go test ./internal/conformance/..."

[tasks."conformance:rust"]
shell = "bash -e -o pipefail -c"
description = "Rust: run every conformance case against the replay server (built first)"
depends = ["conformance:server:build"]
run = "[ -f rust/Cargo.toml ] || { echo 'conformance:rust: skipping (no crate yet)'; exit 0; }; cd rust && IOHR_TEST_REQUIRE_REPLAY=1 cargo nextest run --all-features --test conformance"

[tasks."conformance:ts"]
shell = "bash -e -o pipefail -c"
run = "[ -e conformance/server ] && [ -f typescript/package.json ] || { echo 'conformance:ts: skipping (no server or no package yet)'; exit 0; }; cd typescript && pnpm run conformance"

[tasks."conformance:py"]
shell = "bash -e -o pipefail -c"
run = "[ -e conformance/server ] && [ -f python/pyproject.toml ] || { echo 'conformance:py: skipping (no server or no package yet)'; exit 0; }; cd python && uv run pytest tests/conformance"

[tasks."examples:check"]
shell = "bash -e -o pipefail -c"
description = "Compile every example"
run = """
found=0
[ -d examples/go ] && { found=1; (cd examples/go && go vet ./...) || exit 1; }
[ -d examples/rust ] && { found=1; (cd examples/rust && cargo check --all-targets) || exit 1; }
[ -d examples/typescript ] && { found=1; (cd examples/typescript && pnpm install --frozen-lockfile && pnpm exec tsc --noEmit) || exit 1; }
[ -d examples/python ] && { found=1; (cd examples/python && uv run pyright) || exit 1; }
[ "$found" = 1 ] || echo "examples: none yet, skipping"
"""
