# How @@ID@@ works with the coordinator. Read by people and agents; nothing sensitive, ever.
version = 1

[plan]
# The Planner plan of your account this project's work belongs to ("plan_..."). `iohr project
# init` makes it (named @@NAME@@) or finds the one it made before, and writes its id here. Signed
# out it stays empty: sign in, then `iohr coordinator plan create @@NAME@@ --external-id
# project:@@NAME@@` and put the id here, or run init with `--plan-id`.
id = ""
# The item inside that plan this project's asks attach to (optional).
item = ""

# One ask you can file as it is:  iohr coordinator asks create --kind KIND --body BODY ...
[[ask]]
kind = "chore"                   # bug, feature, ui, api, docs, design, review, chore, question, watch
title = "First task for @@NAME@@"
body = "Add a second health check to @@NAME@@"
external_id = "@@NAME@@-first"   # the same id returns the same ask: filing it twice is safe
priority = 5                     # 1 to 10
