        with:
          swift-version: "6.1"'''
CI_TEST = "swift test"
RELEASE_STEPS = '''      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.1"
      - name: Build (release, static standard library)
