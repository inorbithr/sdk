LAYOUT = '''- `Sources/@@MODULE@@_run/main.swift`: the executable: exit 0 met, 1 missed, 2 broken suite.
- `Sources/@@MODULE@@/Suite.swift`: reads the flags, grades, prints the report.
- `Sources/@@MODULE@@/Runner.swift`: runs the solver over the cases, scores them.
- `Sources/@@MODULE@@/Solver.swift`: the thing under test; the stub model, and the one place to put yours.
- `Sources/@@MODULE@@/Scorers.swift`: deterministic scorers, 0 or 1.
- `Sources/@@MODULE@@/Dataset.swift`, `Bar.swift`: the strict JSONL and TOML readers.
