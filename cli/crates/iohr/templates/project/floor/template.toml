# The enterprise floor every template except blank adds to the base: a release that signs and
# attests, dependency updates and a lockfile, an SBOM (in the CI and the release), an
# `.env.example` with names only, the secret scan (in the CI), AGENTS.md pointing at IO.md,
# and the licence you choose. Hidden: not a template to start a project from.
id = "floor"
description = "The enterprise floor: release with signature and provenance, SBOM, dependency updates, secret scan, licence"
status = "hidden"
extends = "base"
ci_paths = [".github/dependabot.yml"]
steps = [{ name = "git" }, { name = "register" }, { name = "smoke" }]

# Asked, with no default: a licence is the owner's choice and a wrong one is a legal problem.
[[questions]]
key = "license"
prompt = "Which licence? (an SPDX identifier, for example MIT, Apache-2.0, AGPL-3.0-only, or LicenseRef-Proprietary)"
regex = "[A-Za-z0-9.+-]+( (AND|OR|WITH) [A-Za-z0-9.+-]+)*"
help = "Written into the package manifest, the README and IO.md. No default: say it with --set license=ID."

# Shared by every language: how a tag becomes signed, attested artifacts.
[lang_vars.python]
RELEASE_STEPS = """      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the wheel and the source archive
        run: uv build --out-dir dist"""
DEPENDABOT_ECOSYSTEM = "uv"

[lang_vars.typescript]
RELEASE_STEPS = """      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the package
        run: |
          npm ci --ignore-scripts
          npm pack --pack-destination dist"""
DEPENDABOT_ECOSYSTEM = "npm"

[lang_vars.go]
RELEASE_STEPS = """      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build (static, trimmed, one per platform)
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/@@NAME@@-$os-$arch" .
            done
          done"""
DEPENDABOT_ECOSYSTEM = "gomod"

[lang_vars.rust]
RELEASE_STEPS = '''      - name: Build (locked, release)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
          cargo build --release --locked
          mkdir -p dist
          install -m 0755 "target/release/@@NAME@@" "dist/@@NAME@@-linux-amd64"'''
DEPENDABOT_ECOSYSTEM = "cargo"
