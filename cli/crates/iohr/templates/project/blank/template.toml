# The blank template as data (PRD 0088.1): an empty project in your language, nothing else.
# Same format as demo/template.toml: `[[variants]]` are the languages, their files are in
# `variants/<id>/`. No panel, no manifest, no service. The smoke test is the language's own
# test command (`smoke = "test"`), not a heartbeat.
#
# `iohr project init --describe` and the "Describe it" menu entry use this one.
id = "blank"
description = "A starter project in your language: one runnable file, Roles and memory"
status = "live"
extends = "base"
default_variant = "python"
agent_prompt = "This folder is a fresh project in @@LANGUAGE_LABEL@@ (@@SOURCE@@). Build what is described below by editing this folder. Keep it free of secrets, and keep the test passing (@@RUN_TEST@@)."

# Blank keeps no CI unless you ask: `--ci github` adds the base's workflow.
[[questions]]
key = "ci"
prompt = "Keep GitHub Actions files?"
type = "choice"
choices = ["github", "none"]
default = "none"
hidden = true

[[questions]]
key = "security_contact"
prompt = "Security contact"
default = "CHANGE-ME: set a security contact before you publish this project"
hidden = true

[[questions]]
key = "code_owner"
prompt = "Code owner"
default = "@CHANGE-ME"
hidden = true

[[variants]]
id = "python"
label = "Python 3.12 or newer"
status = "live"
needs = ["python3"]
toolchain = ["python3", "--version"]
agent_allow = ["python3 -m unittest", "python3 -m py_compile"]
smoke = "test"
test = ["python3", "-m", "unittest", "discover", "-s", "tests"]
[variants.env]
PYTHONPATH = "$DIR/src"
PYTHONDONTWRITEBYTECODE = "1"
[variants.vars]
SOURCE = "src/@@MODULE@@/, tests in tests/"
IGNORE = "__pycache__/\n*.pyc\n.venv/\n*.egg-info/"
RUN_TEST = "`python3 -m unittest discover -s tests` with PYTHONPATH=src"
README_TEST = "PYTHONPATH=src python3 -m unittest discover -s tests"
TOOLCHAIN_MINOR = "3.12"
LAYOUT = "- `src/@@MODULE@@/`: the code.\n- `tests/test_basic.py`: one test."

[[variants]]
id = "typescript"
label = "TypeScript on Node 22.18 or newer"
status = "live"
needs = ["node"]
toolchain = ["node", "--version"]
agent_allow = ["node --test", "node --check", "npm test"]
smoke = "test"
test = ["node", "--test", "tests/**/*.test.ts"]
[variants.vars]
SOURCE = "src/index.ts, tests in tests/"
IGNORE = "node_modules/"
RUN_TEST = "`node --test 'tests/**/*.test.ts'`"
README_TEST = "node --test 'tests/**/*.test.ts'"
LAYOUT = "- `src/index.ts`: the code. Node runs the TypeScript as it is (22.18 or newer), so there is nothing to build or install.\n- `tests/index.test.ts`: one test."

[[variants]]
id = "go"
label = "Go 1.26 or newer"
status = "live"
needs = ["go"]
toolchain = ["go", "version"]
agent_allow = ["go build", "go test", "go vet"]
smoke = "test"
test = ["go", "test", "./..."]
[variants.vars]
SOURCE = "main.go, tests in main_test.go"
IGNORE = "/@@NAME@@"
RUN_TEST = "`go test ./...`"
README_TEST = "go test ./..."
LAYOUT = "- `main.go`: the code.\n- `main_test.go`: one test."

[[variants]]
id = "rust"
label = "Rust"
status = "live"
needs = ["cargo"]
toolchain = ["rustc", "--version"]
agent_allow = ["cargo build", "cargo test", "cargo fmt", "cargo clippy"]
smoke = "test"
test = ["cargo", "test", "--quiet"]
[variants.env]
CARGO_TARGET_DIR = "$CACHE/target"
[variants.vars]
SOURCE = "src/main.rs, with its test inside"
IGNORE = "target/"
RUN_TEST = "`cargo test`"
README_TEST = "cargo test"
TOOLCHAIN_MINOR = "1.85"
LAYOUT = "- `src/main.rs`: the code and its one test."

# Java: JDK 17 (the long-term-support release the SDK's own java/ module targets, java/pom.xml maven.compiler.release 17;
# https://openjdk.org/projects/jdk/17/). Standard library only: javac and java, no build tool.
[[variants]]
id = "java"
label = "Java 17 or newer"
status = "live"
needs = ["javac", "java"]
toolchain = ["java", "-version"]
agent_allow = ["javac", "java"]
smoke = "test"
build = ["javac", "-d", "$CACHE/classes", "src/Main.java", "tests/MainTest.java"]
test = ["java", "-cp", "$CACHE/classes", "MainTest"]
[variants.vars]
CI_SETUP = '''      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"'''
CI_TEST = '''javac -d out src/Main.java tests/MainTest.java && java -cp out MainTest'''
SOURCE = "src/Main.java, tests in tests/"
IGNORE = '''out/
*.class'''
RUN_TEST = "`javac -d out src/Main.java tests/MainTest.java && java -cp out MainTest`"
README_TEST = "javac -d out src/Main.java tests/MainTest.java && java -cp out MainTest"
TOOLCHAIN_MINOR = "17"
LAYOUT = '''- `src/Main.java`: the code.
- `tests/MainTest.java`: one test (a plain `main`, no test framework).'''

# C#: .NET SDK 10 (LTS, https://dotnet.microsoft.com/platform/support/policy/dotnet-core), pinned by global.json
# (rollForward latestFeature). Standard library only; the test is a console project that runs itself, no test package.
[[variants]]
id = "csharp"
label = "C# on .NET 10 or newer"
status = "live"
needs = ["dotnet"]
toolchain = ["dotnet", "--version"]
agent_allow = ["dotnet build", "dotnet test", "dotnet run"]
smoke = "test"
test = ["dotnet", "run", "--project", "tests/Tests.csproj", "--artifacts-path", "$CACHE/artifacts"]
[variants.env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
DOTNET_CLI_HOME = "$CACHE/dotnet"
[variants.vars]
CI_SETUP = '''      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json'''
CI_TEST = '''dotnet run --project tests/Tests.csproj'''
SOURCE = "src/Program.cs, tests in tests/"
IGNORE = '''bin/
obj/
artifacts/'''
RUN_TEST = "`dotnet run --project tests/Tests.csproj`"
README_TEST = "dotnet run --project tests/Tests.csproj"
TOOLCHAIN_MINOR = "10.0"
LAYOUT = '''- `src/Program.cs`: the code.
- `tests/MainTests.cs`: one test (a console project that runs itself, no test package).
- `global.json`: pins the .NET SDK.'''

# Dart: SDK 3.9 or newer (https://dart.dev/get-dart, pubspec `sdk: ^3.9.0`). Standard library only (dart:io, dart:convert); the test is a plain script, no test package.
[[variants]]
id = "dart"
label = "Dart 3.9 or newer"
status = "live"
needs = ["dart"]
toolchain = ["dart", "--version"]
agent_allow = ["dart run", "dart analyze", "dart format"]
smoke = "test"
test = ["dart", "run", "test/main_test.dart"]
[variants.env]
DART_SUPPRESS_ANALYTICS = "true"
[variants.vars]
CI_SETUP = '''      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable'''
CI_TEST = '''dart analyze && dart run test/main_test.dart'''
SOURCE = "bin/main.dart, tests in test/"
IGNORE = '''.dart_tool/
*.exe'''
RUN_TEST = "`dart run test/main_test.dart`"
README_TEST = "dart run test/main_test.dart"
TOOLCHAIN_MINOR = "3.9"
LAYOUT = '''- `bin/main.dart`: the code.
- `test/main_test.dart`: one test (a plain script, no test package).'''

# Swift: 6.0 or newer with SwiftPM (https://www.swift.org/install/, Package.swift tools-version 6.0). Foundation and XCTest only.
[[variants]]
id = "swift"
label = "Swift 6.0 or newer"
status = "live"
needs = ["swift"]
toolchain = ["swift", "--version"]
agent_allow = ["swift build", "swift test", "swift run"]
smoke = "test"
test = ["swift", "test", "--scratch-path", "$CACHE/build"]
[variants.vars]
CI_SETUP = '''      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0"'''
CI_TEST = '''swift test'''
SOURCE = "Sources/, tests in Tests/"
IGNORE = '''.build/
.swiftpm/'''
RUN_TEST = "`swift test`"
README_TEST = "swift test"
TOOLCHAIN_MINOR = "6.0"
LAYOUT = '''- `Sources/Hello/Hello.swift`: the code.
- `Sources/App/main.swift`: runs it.
- `Tests/HelloTests/HelloTests.swift`: one test (XCTest).'''

[[variants]]
id = "docs"
label = "None, documents only (atlas and memory)"
status = "live"
# No program, so nothing to install, build, run or test: the project is its atlas/ and its
# memory, and `iohr sync` sends them to Decisions. No smoke test (the Smoke step is dropped).
[variants.vars]
SOURCE = "atlas/ (PRDs, RFCs, ADRs, studies) and .inorbit/memory/"
IGNORE = ".DS_Store"
RUN_TEST = "`iohr atlas sync --dry-run`"
README_TEST = "iohr atlas sync --dry-run"
LAYOUT = "- `atlas/`: the project's documents: PRDs, RFCs, ADRs and studies, each with front matter.\n- `.inorbit/memory/`: what the project's agents remember, one file per memory."
CI_SETUP = '''      - name: Documents only, no toolchain to set up
        run: echo "nothing to install"'''
CI_TEST = "test -d atlas"

[[steps]]
name = "git"

[[steps]]
name = "register"

[[steps]]
name = "smoke"
