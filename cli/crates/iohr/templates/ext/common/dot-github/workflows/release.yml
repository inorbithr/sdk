# The release of @@ID@@ at a tag v<version>. Three stages, split so that no step that
# runs this repository's code can reach signing material (as InOrbit's own extensions
# are released):
#
#   build     compiles the program per platform. No id-token, no registry write.
#   assemble  `iohr ext lint --json` gives the config, tools/ext_artifact.py builds the
#             OCI artifact, which is pushed by digest. packages: write only.
#   sign      runs no repository code: a keyless cosign signature over the index digest
#             and SLSA provenance from GitHub, each attached with `oras attach` as an
#             OCI referrer, the way iohr verifies them (ADR 0012).
#
# The signer identity iohr checks is this file at a tag:
#   https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v*
# Renaming this file breaks verification for everyone who installed it.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MISE_YES: "1"
  IOHR_VERSION: "@@IOHR_VERSION@@"
  NAME: "@@NAME@@"

jobs:
  build:
    name: build ${{ matrix.dir }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
@@MATRIX@@
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
@@BUILD@@
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.dir }}
          path: dist/bin/
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      registry: ${{ steps.push.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install: false
      - run: mise use -g oras@1.3.0
      - name: Install iohr
        run: curl -fsSL https://packages.inorbit.hr/install.sh | sh
      - name: Lint (the config comes from here)
        run: |
          mkdir -p dist
          "$HOME/.local/bin/iohr" ext lint --json > dist/lint.json
          version="$(python3 -c 'import json; print(json.load(open("dist/lint.json"))["config"]["version"])')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "the tag $GITHUB_REF_NAME is not extension.toml's version $version"; exit 1; }
      - id: push
        name: Build and push the artifact
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x dist/bin/*/* || true
          digest="$(python3 tools/ext_artifact.py --lint dist/lint.json --bin-dir dist/bin --out dist/oci \
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision "$GITHUB_SHA")"
          registry="ghcr.io/${OWNER,,}/iohr-ext"
          echo "$GH_TOKEN" | mise x -- oras login ghcr.io -u "$GH_ACTOR" --password-stdin
          mise x -- oras cp --from-oci-layout "dist/oci:${GITHUB_REF_NAME#v}" "$registry/$NAME:${GITHUB_REF_NAME#v}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci
          path: dist/oci/
          if-no-files-found: error

  sign:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      DIGEST: ${{ needs.assemble.outputs.digest }}
      REGISTRY: ${{ needs.assemble.outputs.registry }}
      BUNDLE: application/vnd.dev.sigstore.bundle.v0.3+json
    steps:
      # Only the signing tools; no repository code is checked out or run here.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install: false
      - run: mise use -g cosign@3.0.2 oras@1.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci
          path: oci
      - name: Log in
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | mise x -- oras login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Signature bundle (DSSE over the index digest, OCI referrer)
        run: |
          index="oci/blobs/sha256/${DIGEST#sha256:}"
          [ "sha256:$(sha256sum "$index" | cut -d' ' -f1)" = "$DIGEST" ]
          printf '{}' > empty.json
          mise x -- cosign attest-blob --yes --new-bundle-format \
            --type https://sigstore.dev/cosign/sign/v1 --predicate empty.json \
            --bundle signature.sigstore.json "$index"
          mise x -- oras attach --artifact-type "$BUNDLE" \
            "$REGISTRY/$NAME@$DIGEST" "signature.sigstore.json:$BUNDLE"
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAME }}
          subject-digest: ${{ env.DIGEST }}
      - name: Provenance bundle (OCI referrer)
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" provenance.sigstore.json
          mise x -- oras attach --artifact-type "$BUNDLE" \
            "$REGISTRY/$NAME@$DIGEST" "provenance.sigstore.json:$BUNDLE"
