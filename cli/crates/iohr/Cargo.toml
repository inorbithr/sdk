[package]
name = "iohr"
description = "The InOrbit command line: sign in, keep several accounts, call the API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
default-run = "iohr"

[lib]
path = "src/lib.rs"

[[bin]]
name = "iohr"
path = "src/main.rs"

[dependencies]
iohr-auth.workspace = true
iohr-codegen.workspace = true
iohr-openapi.workspace = true

base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
etcetera.workspace = true
flate2.workspace = true
getrandom.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sigstore-verify.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true

# The Debian package (RFC 0021, ADR 0010), built by cli/release/dist.sh from the static
# musl binary with `cargo deb --no-build`. Paths are relative to this crate.
[package.metadata.deb]
name = "iohr"
maintainer = "InOrbit d.o.o. <nevio@inorbit.hr>"
copyright = "2026, InOrbit d.o.o."
license-file = ["../../../LICENSE", "0"]
extended-description = """\
Sign in to InOrbit (in a browser or with a device code), keep several accounts as \
profiles, manage API tokens and call the API. Credentials live in the system's \
credential store, never in a file."""
section = "utils"
priority = "optional"
assets = [
  ["target/release/iohr", "usr/bin/", "755"],
  ["../../target/completions/iohr.bash", "usr/share/bash-completion/completions/iohr", "644"],
  ["../../target/completions/_iohr", "usr/share/zsh/vendor-completions/_iohr", "644"],
  ["../../target/completions/iohr.fish", "usr/share/fish/vendor_completions.d/iohr.fish", "644"],
  ["../../README.md", "usr/share/doc/iohr/README.md", "644"],
  ["../../../NOTICE", "usr/share/doc/iohr/NOTICE", "644"],
]
