# The method case: add a library, checking the official source first.
kind = "method"
language = "go"
task = "Request ids should be standard UUIDs. Add the latest release of github.com/google/uuid and use it in New in id.go."

[defect]
file = "go.mod"
lines = [1, 3]
text = "module example.com/ids"
class = "method"
words = ["github.com/google/uuid"]

[method]
recorded = "2026-11-19"
sources = ["https://proxy.golang.org/github.com/google/uuid/", "https://pkg.go.dev/github.com/google/uuid", "https://github.com/google/uuid"]
truth_url = "https://proxy.golang.org/github.com/google/uuid/@latest"
truth_pointer = "/Version"

[method.truth]
"github.com/google/uuid" = "1.6.0"

[check]
cmd = "sh check.sh"

[proof]
ran = []
ran_any = ["go get", "go list -m", "curl", "go mod"]
