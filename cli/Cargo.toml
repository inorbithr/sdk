[workspace]
resolver = "3"
members = ["crates/iohr", "crates/iohr-auth", "crates/iohr-openapi", "crates/iohr-codegen", "crates/iohr-lab"]
# Built with nightly by `mise run cli:fuzz`.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha.12"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/inorbithr/sdk"
homepage = "https://docs.inorbit.hr"
publish = false

[workspace.dependencies]
iohr-auth = { path = "crates/iohr-auth" }
iohr-codegen = { path = "crates/iohr-codegen" }
iohr-lab = { path = "crates/iohr-lab" }
iohr-openapi = { path = "crates/iohr-openapi" }
inorbithr = { path = "../rust" }

base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
etcetera = "0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
heck = "0.5"
keyring-core = "1"
minijinja = "2"
prettyplease = "0.3"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
# Held at 0.8: typify's API takes schemars 0.8 types (`RootSchema`); see the `ignore` in
# .github/dependabot.yml. Moves to 1.x with typify (oxidecomputer/typify#886).
schemars = "0.8"
semver = "1"
sigstore-verify = { version = "0.14", default-features = false }
syn = { version = "3", features = ["full"] }
typify = "0.8"
rpassword = "7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query", "form", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt", "macros", "time", "io-std", "io-util", "fs", "net", "sync", "process", "signal"] }
toml = "1"
toml_edit = "0.25"
url = "2"
zeroize = "1"

apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

serde_yaml_ng = "0.10"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
