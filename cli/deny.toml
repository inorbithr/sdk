# cargo-deny for the command line: licences, advisories, sources (SR-20, SR-21).

[graph]
all-features = true

[advisories]
yanked = "deny"
# zbus 6 absorbed these three crates, so RustSec marks them unmaintained; no vulnerability.
# They arrive through iohr -> inorbithr (login) -> zbus-secret-service-keyring-store -> secret-service 5 -> zbus 5,
# with no release on zbus 6 yet (https://github.com/z-galaxy/zbus/issues/2043).
# Remove all three once secret-service ships on zbus 6 (a maintainers' decision under SR-21).
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6); held by secret-service 5 on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6); held by secret-service 5 on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6); held by secret-service 5 on zbus 5" },
    # chrono is unmaintained (https://github.com/chronotope/chrono/issues/1768): an informational
    # notice, no affected function and no fixed version. iohr and iohr-atlas-core use it directly and
    # duckdb -> arrow pulls it too, so dropping ours alone does not clear it. iohr moves to jiff; the
    # osv-scanner.toml entries expire on 2027-02-18 (owner decision apr_01M7QSBFYXJDK7GTWHAARM4MPB).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, informational with no affected functions; held by duckdb -> arrow and rmcp/schemars, iohr moves to jiff" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
]

# foldhash (hashbrown, under duckdb): Zlib, permissive and OSI approved (RFC 0213). Allowed for
# this one crate and version only, so no other crate can bring Zlib in unseen.
[[licenses.exceptions]]
name = "foldhash"
version = "0.1.5"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
