# OSV-Scanner config for cli/Cargo.lock. OSV-Scanner, and OpenSSF Scorecard through it, read
# only the osv-scanner.toml next to each lockfile, so cli/fuzz/osv-scanner.toml is a byte copy
# of this file; `mise run audit:osv` fails when the two differ. Every ignore carries a reason
# and an expiry, so it comes back for review (same three advisories as cli/deny.toml).

# zbus 6 absorbed these three crates, so RustSec marks them unmaintained; no vulnerability and
# no fixed version. They arrive through iohr -> inorbithr (login) -> zbus-secret-service-keyring-store ->
# secret-service 5.2.0 (the latest) -> zbus 5, with no release on zbus 6 yet
# (https://github.com/z-galaxy/zbus/issues/2043). Remove all three once secret-service ships
# on zbus 6 (owner decision apr_01M57RXDB6NG3F183GPCJZC5SY).
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2026-12-19
reason = "zvariant unmaintained (merged into zbus 6); held by secret-service 5 on zbus 5"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
ignoreUntil = 2026-12-19
reason = "zbus_names unmaintained (merged into zbus 6); held by secret-service 5 on zbus 5"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
ignoreUntil = 2026-12-19
reason = "zvariant_derive unmaintained (merged into zbus 6); held by secret-service 5 on zbus 5"

# chrono is unmaintained (https://github.com/chronotope/chrono/issues/1768): an informational
# notice with no affected function and no fixed version. iohr and iohr-atlas-core use it directly
# and duckdb -> arrow pulls it too; iohr moves to jiff. Review by the expiry (owner decision
# apr_01M7QSBFYXJDK7GTWHAARM4MPB).
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-18
reason = "chrono unmaintained, informational with no affected functions; held by duckdb -> arrow and rmcp/schemars, iohr moves to jiff"
