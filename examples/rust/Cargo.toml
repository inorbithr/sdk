[package]
name = "inorbithr-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Small, complete programs that use the inorbithr crate; CI compiles them and the README quotes them."

[dependencies]
inorbithr = { path = "../../rust" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "fs"] }

[lints.rust]
unsafe_code = "forbid"
