# release-please opens one release PR per package; merging it tags the commit and creates
# the GitHub release. The publish jobs below then run for the packages released, each in
# an environment that waits for a maintainer's approval (ADR 0003, docs/releasing.md).
# This file name and the environment names are what the registries' trusted publishers
# are bound to: renaming either breaks publishing.
#
# Every package also gets a CycloneDX SBOM and GitHub artifact attestations (build
# provenance for the released file, an SBOM attestation bound to it), and both files are
# attached to the GitHub release (docs/security/verifying-releases.md).
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MISE_YES: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      go: ${{ steps.rp.outputs['go--release_created'] }}
      go_tag: ${{ steps.rp.outputs['go--tag_name'] }}
      go_version: ${{ steps.rp.outputs['go--version'] }}
      rust: ${{ steps.rp.outputs['rust--release_created'] }}
      rust_tag: ${{ steps.rp.outputs['rust--tag_name'] }}
      ts: ${{ steps.rp.outputs['typescript--release_created'] }}
      ts_tag: ${{ steps.rp.outputs['typescript--tag_name'] }}
      py: ${{ steps.rp.outputs['python--release_created'] }}
      py_tag: ${{ steps.rp.outputs['python--tag_name'] }}
      iohr: ${{ steps.rp.outputs['cli--release_created'] }}
      iohr_tag: ${{ steps.rp.outputs['cli--tag_name'] }}
      iohr_version: ${{ steps.rp.outputs['cli--version'] }}
    steps:
      # A GitHub App token, so the release PR triggers CI (the default token cannot).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  go:
    name: publish go
    needs: release-please
    if: needs.release-please.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.go_tag }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "go go:github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod cyclonedx"
      - name: Warm the Go module proxy
        env:
          VERSION: ${{ needs.release-please.outputs.go_version }}
        run: GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/inorbithr/sdk/go@v${VERSION}"
      - name: Source archive
        run: git archive --format=tar.gz --prefix=go/ -o go-source.tar.gz HEAD:go
      - run: mise run go:sbom && mise run sbom:validate
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: go-source.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: go-source.tar.gz
          sbom-path: dist/sbom/go.cdx.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.go_tag }}
        run: gh release upload "$TAG" go-source.tar.gz dist/sbom/go.cdx.json --repo "$GITHUB_REPOSITORY" --clobber

  rust:
    name: publish rust
    needs: release-please
    if: needs.release-please.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment: release-crates
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.rust_tag }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "rust cargo-binstall cargo:cargo-cyclonedx cyclonedx"
      - working-directory: rust
        run: cargo package --locked
      - run: mise run rust:sbom && mise run sbom:validate
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rust/target/package/*.crate
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: rust/target/package/*.crate
          sbom-path: dist/sbom/rust.cdx.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.rust_tag }}
        run: gh release upload "$TAG" rust/target/package/*.crate dist/sbom/rust.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  ts:
    name: publish typescript
    needs: release-please
    if: needs.release-please.outputs.ts == 'true'
    runs-on: ubuntu-latest
    environment: release-npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.ts_tag }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "node pnpm cyclonedx"
      - working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          npm pack --pack-destination ../dist
          # The npm trusted publisher is stage-only: the version waits on npmjs.com until a
          # maintainer approves it with 2FA (docs/releasing.md). Needs npm 11.15 or newer;
          # Node 24 bundles it.
          npm --version | awk -F. '{ exit !($1 > 11 || ($1 == 11 && $2 >= 15)) }' || { echo "npm too old for staged publishing" >&2; exit 1; }
          npm stage publish
      - run: mise run ts:sbom && mise run sbom:validate
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tgz
          sbom-path: dist/sbom/typescript.cdx.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.ts_tag }}
        run: gh release upload "$TAG" dist/*.tgz dist/sbom/typescript.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
      # JSR links only public repositories, so its OIDC publishing starts at launch.
      - if: ${{ !github.event.repository.private }}
        working-directory: typescript
        run: pnpm dlx jsr@0.14.3 publish

  py-build:
    name: build python
    needs: release-please
    if: needs.release-please.outputs.py == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.py_tag }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "python uv cyclonedx"
      - working-directory: python
        run: uv build --out-dir ../dist
      - run: mise run py:sbom && mise run sbom:validate
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/inorbithr-*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/inorbithr-*
          sbom-path: dist/sbom/python.cdx.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.py_tag }}
        run: gh release upload "$TAG" dist/inorbithr-* dist/sbom/python.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/inorbithr-*

  py:
    name: publish python
    needs: py-build
    runs-on: ubuntu-latest
    environment: release-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: |
            dist/inorbithr-*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The command line (ADR 0010): build every target, then attest and attach in one job
  # that waits for a maintainer in the release-cli environment. Channels (APT, Homebrew,
  # winget) follow from the release once it is published.
  iohr-build:
    name: build iohr
    needs: release-please
    if: needs.release-please.outputs.iohr == 'true'
    permissions:
      contents: read
    # A job-level call resolves from the triggering commit, not the runner's filesystem.
    # zizmor prefers `$/` (GitHub, July 2026); actionlint 1.7.12 does not parse it yet.
    uses: ./.github/workflows/cli-build.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.release-please.outputs.iohr_tag }}

  iohr:
    name: publish iohr
    needs: [release-please, iohr-build]
    runs-on: ubuntu-latest
    environment: release-cli
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.iohr_tag }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "rust cargo-binstall cargo:cargo-cyclonedx cyclonedx"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: iohr-*
          path: dist/cli
          merge-multiple: true
      - run: mise run cli:sboms
      - run: mise run cli:checksums
      # Provenance for every file the release carries, then each target's SBOM bound to
      # that target's archive and packages.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/cli/*.tar.gz
            dist/cli/*.zip
            dist/cli/*.deb
            dist/cli/*.msi
            dist/cli/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/cli/iohr-*-x86_64-unknown-linux-musl.tar.gz
            dist/cli/iohr_*_amd64.deb
          sbom-path: dist/cli/iohr-${{ needs.release-please.outputs.iohr_version }}-x86_64-unknown-linux-musl.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/cli/iohr-*-aarch64-unknown-linux-musl.tar.gz
            dist/cli/iohr_*_arm64.deb
          sbom-path: dist/cli/iohr-${{ needs.release-please.outputs.iohr_version }}-aarch64-unknown-linux-musl.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/cli/iohr-*-x86_64-apple-darwin.tar.gz
          sbom-path: dist/cli/iohr-${{ needs.release-please.outputs.iohr_version }}-x86_64-apple-darwin.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/cli/iohr-*-aarch64-apple-darwin.tar.gz
          sbom-path: dist/cli/iohr-${{ needs.release-please.outputs.iohr_version }}-aarch64-apple-darwin.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/cli/iohr-*-x86_64-pc-windows-msvc.zip
            dist/cli/iohr-*-x86_64-pc-windows-msvc.msi
          sbom-path: dist/cli/iohr-${{ needs.release-please.outputs.iohr_version }}-x86_64-pc-windows-msvc.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/cli/iohr-*-aarch64-pc-windows-msvc.zip
            dist/cli/iohr-*-aarch64-pc-windows-msvc.msi
          sbom-path: dist/cli/iohr-${{ needs.release-please.outputs.iohr_version }}-aarch64-pc-windows-msvc.cdx.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.iohr_tag }}
        run: gh release upload "$TAG" dist/cli/* --repo "$GITHUB_REPOSITORY" --clobber

  # The installers, run against the release just published, on each operating system.
  iohr-install:
    name: install iohr (${{ matrix.os }})
    needs: [release-please, iohr]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.iohr_tag }}
      # Only mise itself: the installers need nothing but the runner's shell.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false
      - env:
          IOHR_VERSION: ${{ needs.release-please.outputs.iohr_version }}
          # Signs the GitHub CLI in, so the installers also check the attestation.
          GH_TOKEN: ${{ github.token }}
        run: mise run cli:install-test

  # Homebrew: a pull request with the new formula to inorbithr/homebrew-tap, whose CI
  # installs and tests it. The token comes from the release GitHub App, limited to the
  # tap and to this job's lifetime.
  iohr-tap:
    name: homebrew tap
    needs: [release-please, iohr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.iohr_tag }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false
      - name: Download SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.iohr_tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist/cli
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: inorbithr
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.release-please.outputs.iohr_version }}
        run: mise run cli:tap "$VERSION" dist/cli/SHA256SUMS

  # APT: the signed repository at https://packages.inorbit.hr/apt (Cloudflare R2), with
  # the public key and the installers beside it, then an install from it as the docs say.
  iohr-apt:
    name: apt repository
    needs: [release-please, iohr]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.iohr_tag }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false
      - name: Download the Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.iohr_tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir dist/cli
      - run: sudo apt-get install -y --no-install-recommends reprepro
      - env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: mise run cli:apt --publish
      - env:
          IOHR_VERSION: ${{ needs.release-please.outputs.iohr_version }}
        run: mise run cli:apt-test

  # winget: manifests for microsoft/winget-pkgs, generated and schema-checked on every
  # release and kept as the run's artifact. Submitting them needs a GitHub account with a
  # fork of winget-pkgs and waits for the first stable release (winget-pkgs lists
  # pre-releases under a separate identifier); see docs/releasing.md.
  iohr-winget:
    name: winget manifests
    needs: [release-please, iohr]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.iohr_tag }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "uv"
      - name: Download the installers and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.iohr_tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.msi' --pattern SHA256SUMS --dir dist/cli
      - run: sudo apt-get install -y --no-install-recommends msitools
      - env:
          VERSION: ${{ needs.release-please.outputs.iohr_version }}
        run: mise run cli:winget "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests
          path: dist/winget/
          if-no-files-found: error
