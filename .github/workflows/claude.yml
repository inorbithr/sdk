# @claude in an issue or pull request comment. Only the repository's owner, org members and
# collaborators can trigger it (author_association below, and the action checks write access),
# never bots, and never on a pull request from a fork: a fork's code and its .claude/ settings
# must not run next to the API key (ADR 0005). Opening or assigning an issue does not trigger
# it: anyone can open an issue on a public repository.
# Claude may read, edit and push; it does not run the repository's code here. CI does.
# It runs on the maintainer's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN, made with
# `claude setup-token`), so it shares that plan's usage limits.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: claude
    if: >-
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push Claude's commits to the pull request branch
      pull-requests: write # comment on and update the pull request
      issues: write # reply to the @claude comment on an issue
      id-token: write # the action trades an OIDC token for its GitHub App token
      actions: read # read CI results on the pull request
    steps:
      - name: Refuse pull requests from forks
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            cross=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
            if [ "$cross" = "true" ]; then
              echo "::error::@claude does not run on pull requests from forks."
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status *),Bash(git diff *),Bash(git log *)"
