name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

# Code scanning uploads and dependency review need GitHub Advanced Security on a private
# repository. Until the repository is public these jobs skip; zizmor still runs on every
# change through `mise run repo:check` in ci.yml.
jobs:
  zizmor:
    name: zizmor
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

  codeql:
    name: codeql ${{ matrix.language }}
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none, glob: ".github/workflows/*.yml" }
          # Go is built by hand: autobuild also tried to build the stray Go golden files of
          # the code generator and ran an older Go than go.mod asks for.
          - { language: go, build-mode: manual, glob: "go/go.mod conformance/server/go.mod" }
          - { language: rust, build-mode: none, glob: "*/Cargo.toml" }
          - { language: javascript-typescript, build-mode: none, glob: "typescript/package.json" }
          - { language: python, build-mode: none, glob: "python/pyproject.toml" }
          - { language: java-kotlin, build-mode: none, glob: "java/pom.xml" }
          - { language: csharp, build-mode: none, glob: "csharp/*.sln" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL fails on a language with no sources; skip until the package exists. GLOB
      # holds one or more space-separated patterns.
      - id: present
        env:
          GLOB: ${{ matrix.glob }}
        run: |
          found=false
          for g in $GLOB; do compgen -G "$g" > /dev/null && found=true; done
          if [ "$found" = true ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "no sources for $GLOB yet, skipping"; fi
      # Go: the toolchain go.mod asks for, from mise.toml as in ci.yml. It must be on PATH
      # before init, which wraps `go` to trace the build.
      - if: steps.present.outputs.yes == 'true' && matrix.language == 'go'
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_YES: "1"
        with:
          install_args: "go"
      - if: steps.present.outputs.yes == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The code generator's golden files are expected output, not code we ship; the
          # generated SDKs themselves are scanned in their own directories.
          config: |
            paths-ignore:
              - cli/crates/iohr-codegen/tests/golden
      # `go test -c` compiles every package with its tests and runs none, so CodeQL extracts
      # the test files too. The extractor replays this command line as `go list` and passes
      # on every flag but -c, -i and -o, so test-only flags such as -run or -count break it.
      - if: steps.present.outputs.yes == 'true' && matrix.language == 'go'
        run: |
          for mod in $(git ls-files '*go.mod'); do
            dir="$(dirname "$mod")"
            out="$RUNNER_TEMP/go-tests/$dir"
            mkdir -p "$out"
            (cd "$dir" && go test -c -o "$out/" ./...)
          done
      - if: steps.present.outputs.yes == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
