name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

# Code scanning uploads and dependency review need GitHub Advanced Security on a private
# repository. Until the repository is public these jobs skip; zizmor still runs on every
# change through `mise run repo:check` in ci.yml.
jobs:
  zizmor:
    name: zizmor
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  codeql:
    name: codeql ${{ matrix.language }}
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none, glob: ".github/workflows/*.yml" }
          # Go is built by hand: autobuild also tried to build the stray Go golden files of
          # the code generator and ran an older Go than go.mod asks for.
          - { language: go, build-mode: manual, glob: "go/go.mod conformance/server/go.mod" }
          - { language: rust, build-mode: none, glob: "*/Cargo.toml" }
          - { language: javascript-typescript, build-mode: none, glob: "typescript/package.json" }
          - { language: python, build-mode: none, glob: "python/pyproject.toml" }
          - { language: java-kotlin, build-mode: none, glob: "java/pom.xml" }
          - { language: csharp, build-mode: none, glob: "csharp/*.sln" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL fails on a language with no sources; skip until the package exists. GLOB
      # holds one or more space-separated patterns.
      - id: present
        env:
          GLOB: ${{ matrix.glob }}
        run: |
          found=false
          for g in $GLOB; do compgen -G "$g" > /dev/null && found=true; done
          if [ "$found" = true ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "no sources for $GLOB yet, skipping"; fi
      - if: steps.present.outputs.yes == 'true'
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The code generator's golden files are expected output, not code we ship; the
          # generated SDKs themselves are scanned in their own directories.
          config: |
            paths-ignore:
              - cli/crates/iohr-codegen/tests/golden
      # Go: the toolchain go.mod asks for, from mise.toml as in ci.yml. `go test -run '^$'`
      # compiles every package with its tests, so CodeQL extracts the test files too, and
      # runs none of them.
      - if: steps.present.outputs.yes == 'true' && matrix.language == 'go'
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          MISE_YES: "1"
        with:
          install_args: "go"
      - if: steps.present.outputs.yes == 'true' && matrix.language == 'go'
        run: |
          for mod in $(git ls-files '*go.mod'); do
            (cd "$(dirname "$mod")" && go test -count=1 -run '^$' ./...)
          done
      - if: steps.present.outputs.yes == 'true'
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
