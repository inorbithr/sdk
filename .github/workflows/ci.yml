name: ci

# Where each check runs (ADR 0014):
# - pull requests and pushes to main: Linux, the oldest and newest supported version of
#   each language, only the languages a change touches;
# - nightly (and by hand): every language, every supported version, Linux, Windows and
#   macOS; a failure opens or updates an issue;
# - release-please pull requests: the same as nightly, so no release ships untested.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MISE_YES: "1"
  # Each job installs only the tools in its install_args; tasks must not pull in the rest.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Everything runs on the full runs; otherwise the path filters decide.
      full: ${{ steps.full.outputs.full }}
      go: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.go == 'true' }}
      rust: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.rust == 'true' }}
      ts: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.ts == 'true' }}
      py: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.py == 'true' }}
      java: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.java == 'true' }}
      csharp: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.csharp == 'true' }}
      cli: ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.cli == 'true' }}
      any: >-
        ${{ steps.full.outputs.full == 'true' || steps.filter.outputs.go == 'true' ||
        steps.filter.outputs.rust == 'true' || steps.filter.outputs.ts == 'true' ||
        steps.filter.outputs.py == 'true' || steps.filter.outputs.java == 'true' ||
        steps.filter.outputs.csharp == 'true' }}
    steps:
      - id: full
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$EVENT:$HEAD_REF" in
            schedule:*|workflow_dispatch:*|pull_request:release-please--*) echo "full=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "full=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.full.outputs.full != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.full.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'spec/**'
              - 'conformance/**'
              - 'mise.toml'
              - 'tools/iohr.sh'
              - '.github/workflows/ci.yml'
              # Every language's surface is generated by these (ADR 0011).
              - 'cli/crates/iohr-openapi/**'
              - 'cli/crates/iohr-codegen/**'
            go:
              - *shared
              - 'go/**'
              - 'examples/go/**'
            rust:
              - *shared
              - 'rust/**'
              - 'examples/rust/**'
            ts:
              - *shared
              - 'typescript/**'
              - 'examples/typescript/**'
            py:
              - *shared
              - 'python/**'
              - 'examples/python/**'
            java:
              - *shared
              - 'java/**'
              - 'examples/java/**'
            csharp:
              - *shared
              - 'csharp/**'
              - 'examples/csharp/**'
            cli:
              - 'cli/**'
              - 'rust/**'
              - 'spec/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'

  repo:
    name: repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "go golangci-lint python uv typos actionlint zizmor osv-scanner shellcheck go:github.com/oasdiff/oasdiff"
      - run: mise run repo:check
      - run: mise run spec:lint
      - run: mise run conformance:validate
      - run: mise run conformance:server:check
      - run: mise run audit:osv

  # The command line and the replay server, built once on Linux for every Linux language
  # job: they generate the surface with `iohr` and run conformance against `replay`.
  tools:
    name: tools
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "rust go"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - run: cargo build --locked --manifest-path cli/Cargo.toml -p iohr
      - run: mise run conformance:server:build
      - run: |
          mkdir -p ci-tools
          cp cli/target/debug/iohr conformance/server/bin/replay ci-tools/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-linux
          path: ci-tools/
          if-no-files-found: error
          retention-days: 1

  go:
    name: go ${{ matrix.go }} (${{ matrix.os }})
    needs: [changes, tools]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.26", "1.27"]
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"windows-latest","go":"1.27"},{"os":"macos-latest","go":"1.27"}]' || '[]') }}
    env:
      MISE_GO_VERSION: ${{ matrix.go }}
      # Linux cells use the tools job's binaries; Windows and macOS build their own.
      IOHR_BIN: ${{ matrix.os == 'ubuntu-latest' && format('{0}/ci-tools/iohr', github.workspace) || '' }}
      REPLAY_PREBUILT: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # One cell builds the generator's compile test (it needs Rust).
      COMPILE_CELL: ${{ matrix.os == 'ubuntu-latest' && matrix.go == '1.27' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: >-
            go golangci-lint go:golang.org/x/exp/cmd/gorelease go:golang.org/x/vuln/cmd/govulncheck
            ${{ (matrix.os != 'ubuntu-latest' || (matrix.go == '1.27')) && 'rust cargo-binstall cargo:cargo-nextest' || '' }}
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-linux
          path: ci-tools
      - if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ci-tools/iohr ci-tools/replay
          mkdir -p conformance/server/bin && cp ci-tools/replay conformance/server/bin/replay
      - run: mise run go:gen && git diff --exit-code -- go
      - run: mise run go:check
      - run: mise run go:audit
      - run: mise run conformance:go
      - if: env.COMPILE_CELL == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # A generated two-profile surface builds and the wrong profile does not.
      - if: env.COMPILE_CELL == 'true'
        run: IOHR_TEST_COMPILE=go mise run cli:compile-test
      - run: mise run go:api
        if: github.event_name == 'pull_request'

  rust:
    name: rust ${{ matrix.rust }} (${{ matrix.os }})
    needs: [changes, tools]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: ["1.94", "1.99.0"]
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"windows-latest","rust":"1.99.0"},{"os":"macos-latest","rust":"1.99.0"}]' || '[]') }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
      IOHR_BIN: ${{ matrix.os == 'ubuntu-latest' && format('{0}/ci-tools/iohr', github.workspace) || '' }}
      REPLAY_PREBUILT: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: >-
            rust cargo-binstall cargo:cargo-nextest cargo:cargo-semver-checks cargo:cargo-hack cargo-deny
            ${{ matrix.os != 'ubuntu-latest' && 'go' || '' }}
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-linux
          path: ci-tools
      - if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ci-tools/iohr ci-tools/replay
          mkdir -p conformance/server/bin && cp ci-tools/replay conformance/server/bin/replay
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # MISE_RUST_VERSION overrides the version and drops the components mise.toml asks for.
      - run: rustup component add rustfmt clippy
      - run: mise run rust:gen && git diff --exit-code -- rust
      - run: mise run rust:check
      - run: mise run rust:audit
      - run: mise run rust:features
      - run: mise run conformance:rust
      - run: mise run rust:api
        if: github.event_name == 'pull_request' && matrix.rust != '1.94'

  ts:
    name: ts node ${{ matrix.node }} (${{ matrix.os }})
    needs: [changes, tools]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The oldest and newest supported versions; the full runs add the ones between.
        node: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["22","24","26"]' || '["22","26"]') }}
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"windows-latest","node":"26"}]' || '[]') }}
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
      IOHR_BIN: ${{ matrix.os == 'ubuntu-latest' && format('{0}/ci-tools/iohr', github.workspace) || '' }}
      REPLAY_PREBUILT: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      COMPILE_CELL: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '26' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: >-
            node pnpm biome
            ${{ matrix.os != 'ubuntu-latest' && 'go rust cargo-binstall cargo:cargo-nextest' || (matrix.node == '26' && 'rust cargo-binstall cargo:cargo-nextest' || '') }}
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-linux
          path: ci-tools
      - if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ci-tools/iohr ci-tools/replay
          mkdir -p conformance/server/bin && cp ci-tools/replay conformance/server/bin/replay
      - run: mise run ts:gen && git diff --exit-code -- typescript
      - run: mise run ts:check
      - run: mise run ts:audit
      - run: mise run conformance:ts
      - if: env.COMPILE_CELL == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # A generated two-profile surface type-checks and the wrong profile does not.
      - if: env.COMPILE_CELL == 'true'
        run: IOHR_TEST_COMPILE=typescript mise run cli:compile-test

  py:
    name: py ${{ matrix.python }} (${{ matrix.os }})
    needs: [changes, tools]
    if: needs.changes.outputs.py == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The oldest and newest supported versions; the full runs add the ones between.
        python: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["3.11","3.12","3.13","3.14"]' || '["3.11","3.14"]') }}
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"windows-latest","python":"3.14"}]' || '[]') }}
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python }}
      UV_PYTHON: ${{ matrix.python }}
      IOHR_BIN: ${{ matrix.os == 'ubuntu-latest' && format('{0}/ci-tools/iohr', github.workspace) || '' }}
      REPLAY_PREBUILT: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      COMPILE_CELL: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: >-
            python uv
            ${{ matrix.os != 'ubuntu-latest' && 'go rust cargo-binstall cargo:cargo-nextest' || (matrix.python == '3.14' && 'rust cargo-binstall cargo:cargo-nextest' || '') }}
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-linux
          path: ci-tools
      - if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ci-tools/iohr ci-tools/replay
          mkdir -p conformance/server/bin && cp ci-tools/replay conformance/server/bin/replay
      - run: mise run py:gen && git diff --exit-code -- python
      - run: mise run py:check
      - run: mise run py:audit
      - run: mise run conformance:py
      - if: env.COMPILE_CELL == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # A generated two-profile surface passes pyright and mypy (strict) and the wrong
      # profile does not.
      - if: env.COMPILE_CELL == 'true'
        run: IOHR_TEST_COMPILE=python mise run cli:compile-test
      - run: mise run py:api
        if: github.event_name == 'pull_request'

  java:
    name: java ${{ matrix.java }} (${{ matrix.os }})
    needs: [changes, tools]
    if: needs.changes.outputs.java == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ["temurin-17.0.20+8", "temurin-21.0.12+8.0.LTS"]
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"windows-latest","java":"temurin-17.0.20+8"}]' || '[]') }}
    env:
      MISE_JAVA_VERSION: ${{ matrix.java }}
      IOHR_BIN: ${{ matrix.os == 'ubuntu-latest' && format('{0}/ci-tools/iohr', github.workspace) || '' }}
      REPLAY_PREBUILT: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      COMPILE_CELL: ${{ matrix.os == 'ubuntu-latest' && matrix.java == 'temurin-21.0.12+8.0.LTS' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: >-
            java maven
            ${{ matrix.os != 'ubuntu-latest' && 'go rust cargo-binstall cargo:cargo-nextest' || (matrix.java == 'temurin-21.0.12+8.0.LTS' && 'rust cargo-binstall cargo:cargo-nextest' || '') }}
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-linux
          path: ci-tools
      - if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ci-tools/iohr ci-tools/replay
          mkdir -p conformance/server/bin && cp ci-tools/replay conformance/server/bin/replay
      - run: mise run java:gen && git diff --exit-code -- java
      - run: mise run java:check
      - run: mise run conformance:java
      - if: env.COMPILE_CELL == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # A generated two-profile surface compiles and the wrong profile does not.
      - if: env.COMPILE_CELL == 'true'
        run: IOHR_TEST_COMPILE=java mise run cli:compile-test

  csharp:
    name: csharp (${{ matrix.os }})
    needs: [changes, tools]
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"windows-latest"}]' || '[]') }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      IOHR_BIN: ${{ matrix.os == 'ubuntu-latest' && format('{0}/ci-tools/iohr', github.workspace) || '' }}
      REPLAY_PREBUILT: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      COMPILE_CELL: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Rust on every cell: Linux for the compile test, the others to build iohr.
          install_args: >-
            dotnet rust cargo-binstall cargo:cargo-nextest
            ${{ matrix.os != 'ubuntu-latest' && 'go' || '' }}
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-linux
          path: ci-tools
      - if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ci-tools/iohr ci-tools/replay
          mkdir -p conformance/server/bin && cp ci-tools/replay conformance/server/bin/replay
      - run: mise run csharp:gen && git diff --exit-code -- csharp
      - run: mise run csharp:check
      - run: mise run conformance:csharp
      - if: env.COMPILE_CELL == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # A generated two-profile surface builds and the wrong profile does not.
      - if: env.COMPILE_CELL == 'true'
        run: IOHR_TEST_COMPILE=csharp mise run cli:compile-test

  cli:
    name: cli ${{ matrix.rust }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: ["1.94", "1.99.0"]
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"windows-latest","rust":"1.99.0"},{"os":"macos-latest","rust":"1.99.0"}]' || '[]') }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
      # macOS and Windows runners have a credential store: its test must run, not skip
      # (SR-24). Linux gets one in the cli:keyring step.
      IOHR_TEST_REQUIRE_STORE: ${{ matrix.os != 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "rust cargo-binstall cargo:cargo-nextest cargo-deny shellcheck"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # MISE_RUST_VERSION overrides the version and drops the components mise.toml asks for.
      - run: rustup component add rustfmt clippy
      - run: mise run cli:check
      - run: mise run cli:audit
      # A generated surface builds against rust/ and the wrong profile is refused.
      - if: runner.os == 'Linux' && matrix.rust != '1.94'
        run: mise run cli:compile-test
      - if: runner.os == 'Linux' && matrix.rust != '1.94'
        run: mise run cli:installers
      # A Secret Service for the Linux credential-store test; packages from the runner image's archive.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus
      - if: runner.os == 'Linux'
        run: mise run cli:keyring
      # Browser and device sign-in against the identity provider the platform runs.
      - if: runner.os == 'Linux' && matrix.rust != '1.94'
        run: mise run cli:hydra

  examples:
    name: examples
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "go rust node pnpm python uv dotnet java maven"
      - run: mise run examples:check

  # The only required status check. Skipped jobs count as passing; failed or
  # cancelled ones do not.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [repo, tools, go, rust, ts, py, java, csharp, cli, examples]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # A failed nightly opens an issue, or comments on the one still open.
  nightly-report:
    name: nightly report
    needs: ci-ok
    if: always() && github.event_name == 'schedule' && needs.ci-ok.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly CI failed"
          body="The nightly run (every language, version and operating system) failed: $RUN_URL"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
