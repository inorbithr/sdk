name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MISE_YES: "1"
  # Each job installs only the tools in its install_args; tasks must not pull in the rest.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      py: ${{ steps.filter.outputs.py }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'spec/**'
              - 'conformance/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            go:
              - *shared
              - 'go/**'
              - 'examples/go/**'
            rust:
              - *shared
              - 'rust/**'
              - 'examples/rust/**'
            ts:
              - *shared
              - 'typescript/**'
              - 'examples/typescript/**'
            py:
              - *shared
              - 'python/**'
              - 'examples/python/**'
            cli:
              - 'cli/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'

  repo:
    name: repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "go python uv typos actionlint zizmor osv-scanner go:github.com/oasdiff/oasdiff"
      - run: mise run repo:check
      - run: mise run spec:lint
      - run: mise run conformance:validate
      - run: mise run audit:osv

  go:
    name: go ${{ matrix.go }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.26", "1.27"]
        # Windows and macOS cost 2x and 10x minutes on a private repository: they run on
        # main, the merge queue and release PRs, not on every pull request.
        include: ${{ fromJSON((github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) && '[]' || '[{"os":"windows-latest","go":"1.27"},{"os":"macos-latest","go":"1.27"}]') }}
    env:
      MISE_GO_VERSION: ${{ matrix.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "go golangci-lint go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen go:golang.org/x/exp/cmd/gorelease go:golang.org/x/vuln/cmd/govulncheck"
      - run: mise run go:gen && git diff --exit-code -- go
      - run: mise run go:check
      - run: mise run go:audit
      - run: mise run conformance:go
      - run: mise run go:api
        if: github.event_name == 'pull_request'

  rust:
    name: rust ${{ matrix.rust }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: ["1.94", "1.98.1"]
        # Windows and macOS cost 2x and 10x minutes on a private repository: they run on
        # main, the merge queue and release PRs, not on every pull request.
        include: ${{ fromJSON((github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) && '[]' || '[{"os":"windows-latest","rust":"1.98.1"},{"os":"macos-latest","rust":"1.98.1"}]') }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "rust cargo-binstall cargo:cargo-nextest cargo:cargo-semver-checks cargo:cargo-hack cargo-deny"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - run: mise run rust:gen && git diff --exit-code -- rust
      - run: mise run rust:check
      - run: mise run rust:audit
      - run: mise run rust:features
      - run: mise run conformance:rust
      - run: mise run rust:api
        if: github.event_name == 'pull_request' && matrix.rust != '1.94'

  ts:
    name: ts node ${{ matrix.node }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22", "24", "26"]
        # Windows and macOS cost 2x and 10x minutes on a private repository: they run on
        # main, the merge queue and release PRs, not on every pull request.
        include: ${{ fromJSON((github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) && '[]' || '[{"os":"windows-latest","node":"24"}]') }}
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "node pnpm biome"
      - run: mise run ts:gen && git diff --exit-code -- typescript
      - run: mise run ts:check
      - run: mise run ts:audit
      - run: mise run conformance:ts

  py:
    name: py ${{ matrix.python }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # Windows and macOS cost 2x and 10x minutes on a private repository: they run on
        # main, the merge queue and release PRs, not on every pull request.
        include: ${{ fromJSON((github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) && '[]' || '[{"os":"windows-latest","python":"3.14"}]') }}
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python }}
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "python uv"
      - run: mise run py:gen && git diff --exit-code -- python
      - run: mise run py:check
      - run: mise run py:audit
      - run: mise run conformance:py
      - run: mise run py:api
        if: github.event_name == 'pull_request'

  cli:
    name: cli ${{ matrix.rust }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: ["1.94", "1.98.1"]
        # Windows and macOS cost 2x and 10x minutes on a private repository: they run on
        # main, the merge queue and release PRs, not on every pull request.
        include: ${{ fromJSON((github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) && '[]' || '[{"os":"windows-latest","rust":"1.98.1"},{"os":"macos-latest","rust":"1.98.1"}]') }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
      # macOS and Windows runners have a credential store: its test must run, not skip
      # (SR-24). Linux gets one in the cli:keyring step.
      IOHR_TEST_REQUIRE_STORE: ${{ matrix.os != 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "rust cargo-binstall cargo:cargo-nextest cargo-deny"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      # MISE_RUST_VERSION overrides the version and drops the components mise.toml asks for.
      - run: rustup component add rustfmt clippy
      - run: mise run cli:check
      - run: mise run cli:audit
      # A Secret Service for the Linux credential-store test; packages from the runner image's archive.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus
      - if: runner.os == 'Linux'
        run: mise run cli:keyring

  examples:
    name: examples
    needs: changes
    if: >-
      needs.changes.outputs.go == 'true' || needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ts == 'true' || needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: "go rust node pnpm python uv"
      - run: mise run examples:check

  # The only required status check. Skipped jobs count as passing; failed or
  # cancelled ones do not.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [repo, go, rust, ts, py, cli, examples]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
